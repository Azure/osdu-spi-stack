[project]
name = "spi"
# Sentinel for source builds; release CI overwrites it with the real X.Y.Z
# before `uv build`. The fallback in src/spi/__init__.py must match it.
version = "0.0.0+source"
description = "OSDU SPI Stack CLI (osdu-spi-stack) - Deploy OSDU on Azure with SPI services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Microsoft Corporation" },
]
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "packaging>=26.3",
]

[project.scripts]
spi = "spi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spi"]

# Bundle the Bicep templates inside the wheel at spi/infra/. The CLI
# resolves them via src/spi/paths.py:INFRA_ROOT, which prefers the
# packaged copy and falls back to <repo>/infra for source checkouts.
[tool.hatch.build.targets.wheel.force-include]
"infra" = "spi/infra"

# Belt-and-suspenders alongside .gitignore: hatchling's default sdist scan can
# pull in transient build/cache directories that contain absolute symlinks to
# the host Python interpreter. Force them out of the sdist regardless of which
# excludes hatchling decides to honor.
[tool.hatch.build.targets.sdist]
exclude = [
    ".uv-cache",
    ".venv",
    "workspace",
    ".claude",
    ".archon",
    "logs",
]

# Prefer the Microsoft package feed proxy (an anonymous PyPI mirror) so
# corporate networks that block pythonhosted.org can resolve. The proxy lags
# new releases, so PyPI stays as the best-match fallback; both serve the same
# public namespace. uv ignores pip.ini, so the index is declared here.
# `uv sync` downloads from the sources recorded in uv.lock; after an index
# change, run `uv lock --refresh` on an unrestricted network to re-source it.
[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "microsoft-pypi-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"

# ruff resolves from the proxy only: best-match would otherwise chase PyPI's
# newest release, which the proxy has not ingested, and break corporate sync.
[tool.uv.sources]
ruff = { index = "microsoft-pypi-proxy" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
