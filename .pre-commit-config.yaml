# Local hooks only, each invoked through `uv run`, so pyproject.toml pins the
# tool versions and local runs match CI.

default_language_version:
  python: python3.10

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        # A fix fails the commit so the corrected files get re-staged.

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ty
        name: ty check
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false
        # ty resolves imports across the project, so the staged file list is not enough.

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
