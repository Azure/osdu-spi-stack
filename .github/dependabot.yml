# Tracks the CLI's Python dependencies and action pins only. OSDU image tags
# move through `spi reconcile --refresh-images`, and Helm chart pins are bumped
# by hand against each chart's release notes.
#
# The Python ecosystem is `uv`, not `pip`: `pip` reads pyproject.toml as a plain
# manifest and never regenerates uv.lock, so every bump landed with a stale lock
# and failed the `lock` job in validate.yml.

version: 2

# Dependabot only reaches hosts declared here, even anonymous ones. The proxy's
# simple index links its files to the ms-feed-25 feed, so both hosts are needed.
registries:
  microsoft-pypi-proxy:
    type: python-index
    url: https://packagefeedproxy.microsoft.io/pypi/simple/
  microsoft-pypi-feed:
    type: python-index
    url: https://ms-feed-25.pkgs.visualstudio.com/6f084628-a36d-42cb-934d-057357e379dc/_packaging/49d7402f-07bb-4b18-a9ce-086e6e98a554/pypi/simple/

updates:
  - package-ecosystem: uv
    directory: "/"
    registries:
      - microsoft-pypi-proxy
      - microsoft-pypi-feed
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      gh-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
