# Tracks the CLI's Python dependencies and action pins only. OSDU image tags
# move through `spi reconcile --refresh-images`, and Helm chart pins are bumped
# by hand against each chart's release notes.
#
# The Python ecosystem is `uv`, not `pip`: `pip` reads pyproject.toml as a plain
# manifest and never regenerates uv.lock, so every bump landed with a stale lock
# and failed the `lock` job in validate.yml.

version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      gh-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
