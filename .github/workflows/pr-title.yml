name: PR Title

# The PR title becomes the squash commit subject that release-please
# versions from, so a malformed title mis-versions a release.
#
# pull_request_target so the base-branch definition always runs (a PR cannot
# lint itself green). Safe only while the job never checks out PR code.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            style
            chore
