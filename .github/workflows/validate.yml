name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lock:
    name: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Every other job runs `uv sync --frozen`, which happily installs a lock
      # that no longer matches pyproject.toml. This is the check that notices.
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  mirror-deps:
    name: mirror-deps
    runs-on: ubuntu-latest
    env:
      # packagefeedproxy.microsoft.io lags PyPI by roughly a week. This job is
      # the gate that keeps the wheel and the dev group installable inside that
      # window; the rest of the repo still resolves through PyPI as well.
      MIRROR_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install the wheel with the mirror as the only index
        run: |
          set -euo pipefail
          uv venv /tmp/mirror-venv
          uv pip install \
            --python /tmp/mirror-venv/bin/python \
            --no-cache \
            --default-index "$MIRROR_INDEX" \
            --index-strategy unsafe-best-match \
            dist/*.whl
      - name: Smoke-test the mirror-only install
        run: |
          set -euo pipefail
          /tmp/mirror-venv/bin/spi --version
          /tmp/mirror-venv/bin/spi --help
      - name: Resolve the dev dependency group from the mirror only
        run: |
          uv pip compile \
            --group dev pyproject.toml \
            --no-cache \
            --default-index "$MIRROR_INDEX" \
            --index-strategy unsafe-best-match \
            -o /dev/null

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: ruff format --check
        run: uv run ruff format --check src tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ty check
        run: uv run ty check src tests

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest with coverage
        run: |
          uv run pytest \
            --cov=src/spi \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  windows-shims:
    name: windows-shims
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The shim tests prove nothing unless Python itself resolves az to a .cmd.
      - name: Require Python to resolve az to a batch shim
        run: >
          uv run python -c "import shutil,sys; p=shutil.which('az') or '';
          print('az resolves to', p);
          sys.exit(0 if p.lower().endswith(('.cmd','.bat')) else 1)"
      - name: Batch shim and Bicep regressions
        run: uv run pytest -q tests/test_shell.py tests/test_shell_windows.py tests/test_bicep_compile.py

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: "5.4.3"
      KUBECONFORM_VERSION: "0.6.7"
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate all kustomizations
        run: bash scripts/validate_manifests.sh

  bicep-whatif:
    name: bicep-whatif
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check Azure secrets are available
        id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          # Dependabot and fork PRs see no repo secrets; skip rather than fail
          # so the required check still reports.
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_CLIENT_ID not available (Dependabot or fork PR); skipping bicep-whatif"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - name: Azure login (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Bicep CLI
        if: steps.gate.outputs.skip != 'true'
        run: az bicep install
      - name: Bicep build (syntax check)
        if: steps.gate.outputs.skip != 'true'
        run: az bicep build --file infra/main.bicep
      - name: Ensure what-if RG exists
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          az group create --name spi-ci-whatif --location centralus --only-show-errors -o none
      - name: What-if deployment
        if: steps.gate.outputs.skip != 'true'
        run: |
          az deployment group what-if \
            --resource-group spi-ci-whatif \
            --template-file infra/main.bicep \
            --parameters infra/params/dev1.bicepparam \
            --no-pretty-print
