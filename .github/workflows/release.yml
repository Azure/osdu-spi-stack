name: Release

# Merging the release-please PR creates a DRAFT release; the assets job
# publishes it only after uploading the wheel, so /releases/latest never
# serves a release without the spi-*-py3-none-any.whl that `spi update`
# requires (src/spi/update.py). Publishing is what creates the vX.Y.Z tag.
#
# The App token matters: PRs opened with GITHUB_TOKEN never trigger
# workflows, so validate.yml would not run on the release PR.

on:
  push:
    branches: [main]
  # Rebuild assets for an already-published tag. A failed assets job on a
  # still-draft release is recovered with "Re-run failed jobs" instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z) to rebuild assets for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.repository == 'Azure/osdu-spi-stack'
    runs-on: ubuntu-latest
    outputs:
      # Manifest configs emit path-prefixed outputs; fall back to top-level.
      release_created: ${{ steps.release.outputs['.--release_created'] || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      sha: ${{ steps.release.outputs['.--sha'] || steps.release.outputs.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: assets
    needs: release-please
    # !cancelled() lets this run when release-please was skipped (dispatch).
    if: >
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve tag, version, and build ref
        id: meta
        # Untrusted values reach the shell only through env, never inline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            REF="$TAG"
          else
            TAG="$RP_TAG"
            # The tag does not exist while the release is draft; build by SHA.
            REF="$RP_SHA"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "ref=$REF"; } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Stamp pyproject.toml with release version
        run: |
          sed -i.bak -E "s/^version = \".*\"/version = \"${{ steps.meta.outputs.version }}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          grep '^version' pyproject.toml

      - name: Build wheel + sdist
        run: |
          uv build
          # spi update contract: asset must be spi-<version>-py3-none-any.whl
          test -f "dist/spi-${{ steps.meta.outputs.version }}-py3-none-any.whl"
          ls -la dist/

      - name: Upload assets and publish release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Hide the release while assets change: a failed upload then leaves
          # a draft, never a published release missing its wheel.
          gh release edit "$TAG" --draft=true --repo "${{ github.repository }}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
