name: Release

# Merging the release-please PR creates a DRAFT release; the assets job
# publishes it only after uploading the wheel, so /releases/latest never
# serves a release without the spi-*-py3-none-any.whl that `spi update`
# requires (src/spi/update.py). The vX.Y.Z tag is created with the draft
# (force-tag-creation), so release-please still finds the version if the
# assets job fails before publishing.
#
# The App token matters: PRs opened with GITHUB_TOKEN never trigger
# workflows, so validate.yml would not run on the release PR.
#
# bump-environment runs last: once a real release is cut and its assets
# publish, it opens a PR bumping ops/environments/shared.yaml's stackVersion
# to the new tag. That file is excluded from release-please's own commit
# parsing (.release-please-config.json), so merging the bump PR cannot
# trigger another release; it instead triggers env-upgrade.

on:
  push:
    branches: [main]
  # Rebuild assets for an existing tag. Prefer "Re-run failed jobs" for a
  # failed assets job on a still-draft release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z) to rebuild assets for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.repository == 'Azure/osdu-spi-stack'
    runs-on: ubuntu-latest
    outputs:
      # Manifest configs emit path-prefixed outputs; fall back to top-level.
      release_created: ${{ steps.release.outputs['.--release_created'] || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      sha: ${{ steps.release.outputs['.--sha'] || steps.release.outputs.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: assets
    needs: release-please
    # !cancelled() lets this run when release-please was skipped (dispatch).
    if: >
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve tag, version, and build ref
        id: meta
        # Untrusted values reach the shell only through env, never inline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            REF="$TAG"
          else
            TAG="$RP_TAG"
            # Build the exact commit release-please recorded for the release.
            REF="$RP_SHA"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "ref=$REF"; } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Stamp pyproject.toml with release version
        run: |
          sed -i.bak -E "s/^version = \".*\"/version = \"${{ steps.meta.outputs.version }}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          grep '^version' pyproject.toml

      - name: Build wheel + sdist
        run: |
          uv build
          # spi update contract: asset must be spi-<version>-py3-none-any.whl
          test -f "dist/spi-${{ steps.meta.outputs.version }}-py3-none-any.whl"
          ls -la dist/

      - name: Upload assets and publish release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Hide the release while assets change: a failed upload then leaves
          # a draft, never a published release missing its wheel.
          gh release edit "$TAG" --draft=true --repo "${{ github.repository }}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"

  bump-environment:
    name: bump-environment
    needs: [release-please, assets]
    # Only after release-please actually cut a new release and the assets
    # job published it successfully; never for a workflow_dispatch asset
    # rebuild of an existing tag, which carries no new stackVersion to bump
    # to and would otherwise loop against its own commit.
    if: >
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read the live declaration
        id: declaration
        # Source Python parsing the declaration; see
        # docs/design/environment-lifecycle.md for why this repo never lets
        # a lifecycle step shell-evaluate ops/environments/shared.yaml.
        run: |
          uv sync --frozen
          uv run python scripts/export_environment.py

      - name: Decide whether a bump PR is needed
        id: gate
        env:
          NEW_TAG: v${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.declaration.outputs.declaration_found }}" != "true" ]; then
            echo "::notice::No live declaration; skipping the stackVersion bump PR."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.declaration.outputs.stack_version }}" = "$NEW_TAG" ]; then
            echo "::notice::Declaration already names $NEW_TAG; skipping the stackVersion bump PR."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the stackVersion bump PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: v${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          DECL=ops/environments/shared.yaml
          BRANCH="env-bump/shared-${NEW_TAG}"

          git config user.name "osdu-spi-automation[bot]"
          git config user.email "osdu-spi-automation[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          MATCHES=$(grep -c '^stackVersion:' "$DECL")
          if [ "$MATCHES" != "1" ]; then
            echo "::error::expected exactly one stackVersion line in $DECL, found $MATCHES"
            exit 1
          fi
          sed -i.bak -E "s/^stackVersion:.*/stackVersion: ${NEW_TAG}/" "$DECL"
          rm -f "${DECL}.bak"

          git add "$DECL"
          # The commit that stackVersion bump must touch only the declaration:
          # mixing another file into it would defeat the release-please
          # exclude-paths skip and re-trigger release parsing.
          CHANGED=$(git diff --cached --name-only)
          if [ "$CHANGED" != "$DECL" ]; then
            echo "::error::bump commit touched more than $DECL: $CHANGED"
            exit 1
          fi

          git commit -m "chore(env): bump shared stackVersion to ${NEW_TAG}"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create --repo "${{ github.repository }}" \
              --base main --head "$BRANCH" \
              --title "chore(env): bump shared stackVersion to ${NEW_TAG}" \
              --body "Bumps the shared backing environment's declared \`stackVersion\` to \`${NEW_TAG}\` following its release. Merging triggers \`env-upgrade\`."
          else
            echo "PR for $BRANCH already exists; pushed an updated commit."
          fi
