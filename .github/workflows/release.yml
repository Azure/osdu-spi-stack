name: Release

# release-please creates a draft release and its tag; the assets job publishes
# only after the wheel `spi update` requires is uploaded, so /releases/latest
# never serves a release without it. The App token matters: PRs opened with
# GITHUB_TOKEN never trigger validate.yml. bump-environment then opens the
# stackVersion bump PR, which triggers env-upgrade and not another release.

on:
  push:
    branches: [main]
  # Rebuilds assets for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z) to rebuild assets for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.repository == 'Azure/osdu-spi-stack'
    runs-on: ubuntu-latest
    outputs:
      # Manifest configs emit path-prefixed outputs; fall back to top-level.
      release_created: ${{ steps.release.outputs['.--release_created'] || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      sha: ${{ steps.release.outputs['.--sha'] || steps.release.outputs.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: assets
    needs: release-please
    # !cancelled() lets a dispatch run past the skipped release-please job.
    if: >
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve tag, version, and build ref
        id: meta
        # Untrusted values reach the shell only through env, never inline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            REF="$TAG"
          else
            TAG="$RP_TAG"
            REF="$RP_SHA"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "ref=$REF"; } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Stamp pyproject.toml with release version
        run: |
          sed -i.bak -E "s/^version = \".*\"/version = \"${{ steps.meta.outputs.version }}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          grep '^version' pyproject.toml

      - name: Build wheel + sdist
        run: |
          uv build
          # spi update downloads exactly this asset name.
          test -f "dist/spi-${{ steps.meta.outputs.version }}-py3-none-any.whl"
          ls -la dist/

      - name: Upload assets and publish release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # A failed upload leaves a draft, never a published release missing its wheel.
          gh release edit "$TAG" --draft=true --repo "${{ github.repository }}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"

  bump-environment:
    name: bump-environment
    needs: [release-please, assets]
    # Never on a dispatch rebuild: it carries no new stackVersion to bump to.
    if: >
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read the live declaration
        id: declaration
        # Source Python only parses and validates the declaration.
        run: |
          uv sync --frozen
          uv run python scripts/export_environment.py

      - name: Decide whether a bump PR is needed
        id: gate
        env:
          NEW_TAG: v${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.declaration.outputs.declaration_found }}" != "true" ]; then
            echo "::notice::No live declaration; skipping the stackVersion bump PR."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.declaration.outputs.stack_version }}" = "$NEW_TAG" ]; then
            echo "::notice::Declaration already names $NEW_TAG; skipping the stackVersion bump PR."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the stackVersion bump PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: v${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          DECL=ops/environments/shared.yaml
          BRANCH="env-bump/shared-${NEW_TAG}"

          git config user.name "osdu-spi-automation[bot]"
          git config user.email "osdu-spi-automation[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          MATCHES=$(grep -c '^stackVersion:' "$DECL" || true)
          if [ "$MATCHES" != "1" ]; then
            echo "::error::expected exactly one stackVersion line in $DECL, found $MATCHES"
            exit 1
          fi
          sed -i.bak -E "s/^stackVersion:.*/stackVersion: ${NEW_TAG}/" "$DECL"
          rm -f "${DECL}.bak"

          git add "$DECL"
          # Any other file in this commit would re-enter release-please's commit
          # parsing, which excludes only the declaration path.
          CHANGED=$(git diff --cached --name-only)
          if [ "$CHANGED" != "$DECL" ]; then
            echo "::error::bump commit touched more than $DECL: $CHANGED"
            exit 1
          fi

          git commit -m "chore(env): bump shared stackVersion to ${NEW_TAG}"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create --repo "${{ github.repository }}" \
              --base main --head "$BRANCH" \
              --title "chore(env): bump shared stackVersion to ${NEW_TAG}" \
              --body "Bumps the shared backing environment's declared \`stackVersion\` to \`${NEW_TAG}\` following its release. Merging triggers \`env-upgrade\`."
          else
            echo "PR for $BRANCH already exists; pushed an updated commit."
          fi
