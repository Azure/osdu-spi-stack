name: Orphan RG Sweeper

# Reaps resource groups a cancelled smoke run left behind, since cancellation
# kills the teardown job too. Selection rules live in scripts/sweep_orphan_rgs.sh.

on:
  schedule:
    # Four hours before the 8 AM UTC smoke run.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates only; do not delete"
        type: boolean
        default: false
      age_hours:
        description: "Minimum RG age (hours) before eligible for sweeping"
        type: string
        default: "3"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sweeper
  cancel-in-progress: false

jobs:
  sweep:
    # Same identity and subscription as smoke.yml, or the sweep looks in the wrong place.
    environment: azure-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run sweeper
        env:
          SWEEPER_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SWEEP_AGE_HOURS: ${{ inputs.age_hours || '3' }}
        run: bash scripts/sweep_orphan_rgs.sh
