name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0" # weekly, Sunday 01:30 UTC, to catch newly-published advisories

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload findings to the code-scanning dashboard
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
