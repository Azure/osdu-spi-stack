name: Smoke

# Real `spi up` against the Azure subscription, on schedule and by dispatch,
# never on PR. Each job logs in on its own because the 5-minute GitHub OIDC
# JWT is long dead by the time teardown runs; sweeper.yml is the backstop for
# a full-workflow cancellation, which kills `if: always()` jobs too.

on:
  schedule:
    # Four hours after the 4 AM UTC sweeper run.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      env_suffix:
        description: "RG/cluster env suffix (default: run-<id>)"
        type: string
        default: ""
      profile:
        description: "Deployment profile"
        type: choice
        options:
          - bare
          - core
          - minimal
        default: bare

permissions:
  contents: read
  id-token: write

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  AZURE_LOCATION: centralus

jobs:
  provision:
    environment: azure-smoke
    runs-on: ubuntu-latest
    # AKS Automatic alone takes ~29 min; with PaaS Bicep, the Flux extension
    # and tooling, spi up runs ~45-50 min. 60 leaves headroom.
    timeout-minutes: 60
    outputs:
      rg: ${{ steps.env.outputs.rg }}
      suffix: ${{ steps.env.outputs.suffix }}
      created: ${{ steps.env.outputs.created }}
      profile: ${{ steps.env.outputs.profile }}
    env:
      ENV_SUFFIX: ${{ inputs.env_suffix || format('run{0}', github.run_id) }}
      # The scheduled run measures the infra and empty-GitOps rung.
      PROFILE: ${{ inputs.profile || 'bare' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Install kubelogin
        # AKS Automatic kubeconfigs exec kubelogin for AAD. Inlined because
        # azure/use-kubelogin needs GITHUB_TOKEN to resolve "latest".
        env:
          KUBELOGIN_VERSION: v0.1.4
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubelogin.zip \
            "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip"
          unzip -q /tmp/kubelogin.zip -d /tmp/kubelogin
          sudo install /tmp/kubelogin/bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          kubelogin --version

      - name: Install Helm
        # ubuntu-latest does not reliably preinstall helm.
        uses: azure/setup-helm@v5
        with:
          version: 'v3.16.2'

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pre-cache Azure tokens and resolve deployer OID
        id: prelogin
        # The GitHub OIDC JWT lives 5 minutes; az caches each audience's access
        # token for ~1h. Any audience first exchanged later in the job fails
        # with AADSTS700024, so every one spi up reaches is warmed here.
        run: |
          set -euo pipefail
          # ARM, az ad, the AKS AAD server app (kubelogin), Key Vault.
          az account get-access-token --resource https://management.azure.com -o none
          az account get-access-token --resource https://graph.microsoft.com -o none
          az account get-access-token --resource 6dae42f8-4368-4678-94ff-3960e28e3630 -o none
          az account get-access-token --resource https://vault.azure.net -o none
          # `az ad signed-in-user show` is delegated-only and fails for a service principal.
          OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          if [ -z "$OID" ]; then
            echo "::error::Failed to resolve deployer service principal OID"
            exit 1
          fi
          echo "oid=$OID" >> "$GITHUB_OUTPUT"

      - name: Resolve env name
        id: env
        run: |
          set -euo pipefail
          SUFFIX=$(echo "$ENV_SUFFIX" | tr -cd '[:alnum:]')
          # 24-char storage name limit minus 'osdu', 'ci', 'opendes' and the
          # 5-char name suffix leaves 6; the trailing run_id digits stay unique.
          SUFFIX="${SUFFIX: -6}"
          RG="spi-stack-ci-${SUFFIX}"
          CREATED_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED_UTC" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Resource group: $RG"
          echo "Profile: $PROFILE"

      - name: Quota guard (max 2 in-flight CI smoke RGs)
        run: |
          set -euo pipefail
          count=$(az group list --tag spi-ci-sweep-eligible=true --query 'length(@)' -o tsv)
          echo "In-flight smoke RGs: $count"
          if [ "$count" -gt 2 ]; then
            echo "::error::Too many in-flight smoke RGs ($count). Investigate before scheduling more."
            exit 1
          fi

      - name: Pre-create RG with sweeper tags
        run: |
          set -euo pipefail
          az group create \
            --name "${{ steps.env.outputs.rg }}" \
            --location "$AZURE_LOCATION" \
            --tags \
              spi-ci-sweep-eligible=true \
              "spi-created-utc=${{ steps.env.outputs.created }}" \
              github-run-id=${{ github.run_id }}

      - name: spi up
        env:
          SPI_DEPLOYER_OID: ${{ steps.prelogin.outputs.oid }}
        run: |
          uv sync --frozen
          uv run spi up \
            --env "ci-${{ steps.env.outputs.suffix }}" \
            --profile "$PROFILE" \
            --location "$AZURE_LOCATION"

  verify:
    needs: provision
    environment: azure-smoke
    runs-on: ubuntu-latest
    # Core-profile budget: ~30 min for layers 0a-5a, schema-load's 155 min
    # Kustomization timeout, ~30 min for spi-osdu-reference behind it (230
    # min, the --timeout below), plus setup steps and up to ~15 min of HTTPS
    # probe retries. tests/test_smoke_workflow.py checks the arithmetic.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Install kubelogin
        env:
          KUBELOGIN_VERSION: v0.1.4
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubelogin.zip \
            "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip"
          unzip -q /tmp/kubelogin.zip -d /tmp/kubelogin
          sudo install /tmp/kubelogin/bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          kubelogin --version

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cache Azure tokens and get AKS credentials
        run: |
          set -euo pipefail
          # Warm the audiences kubectl reaches during the wait while the OIDC JWT is alive.
          az account get-access-token --resource https://management.azure.com -o none
          az account get-access-token --resource 6dae42f8-4368-4678-94ff-3960e28e3630 -o none
          az aks get-credentials \
            --resource-group "${{ needs.provision.outputs.rg }}" \
            --name "${{ needs.provision.outputs.rg }}" \
            --overwrite-existing \
            --only-show-errors
          kubelogin convert-kubeconfig -l azurecli

      - name: Wait for Flux Kustomizations to be Ready
        # 230 min; the job budget above explains the figure.
        run: bash scripts/wait_for_flux_ready.sh --timeout 13800

      - name: Acceptance probe (gateway reachable)
        if: ${{ needs.provision.outputs.profile != 'bare' }}
        # Substrate only; service-level acceptance is out of scope for the smoke.
        run: bash scripts/probe_gateway.sh gateway

      - name: Acceptance probe (HTTPS terminates)
        if: ${{ needs.provision.outputs.profile != 'bare' }}
        run: bash scripts/probe_gateway.sh https

      - name: Capture diagnostics on failure
        if: failure()
        run: bash scripts/capture_diagnostics.sh "smoke-${{ github.run_id }}"

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore

  teardown:
    needs: [provision, verify]
    # Runs after a failed or cancelled provision or verify, but not after a
    # skipped provision, which has nothing to tear down.
    if: ${{ always() && needs.provision.result != 'skipped' }}
    environment: azure-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login (OIDC)
        # Logs in again: the provision job's JWT is long dead by now.
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Force RG delete
        run: |
          set -euo pipefail
          RG="${{ needs.provision.outputs.rg }}"
          if [ -z "$RG" ]; then
            echo "No RG output from provision job; nothing to delete."
            exit 0
          fi
          echo "Deleting resource group: $RG"
          az group delete --name "$RG" --yes --no-wait || true
