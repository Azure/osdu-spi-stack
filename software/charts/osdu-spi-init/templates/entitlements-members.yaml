# One Job per partition, adding each member to the root entitlement groups and
# each member user to users and the service user groups. The name hashes the
# lists and the seed generation so a changed list or a changed seed renders a
# new Job, leaving out the member-user list when it is empty so existing Jobs
# keep their name; templates.entitlements_members_job_name computes the same.
{{- if and .Values.membersEnabled .Values.entitlementsMembers }}
{{- $members := .Values.entitlementsMembers | sortAlpha }}
{{- $memberUsers := .Values.entitlementsMemberUsers | default list | sortAlpha }}
{{- $seed := printf "%s#%v" ($members | join ",") .Values.membersGeneration }}
{{- if $memberUsers }}
{{- $seed = printf "%s|%s#%v" ($members | join ",") ($memberUsers | join ",") .Values.membersGeneration }}
{{- end }}
{{- $hash := $seed | sha256sum | trunc 8 }}
{{- range $partition := .Values.partitions }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: entitlements-members-{{ $partition }}-{{ $hash }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "osdu-spi-init.labels" $ | nindent 4 }}
    app.kubernetes.io/component: entitlements-members
    osdu.spi/partition: {{ $partition }}
spec:
  backoffLimit: {{ $.Values.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.membersActiveDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "osdu-spi-init.labels" $ | nindent 8 }}
        app.kubernetes.io/component: entitlements-members
        osdu.spi/partition: {{ $partition }}
        azure.workload.identity/use: "true"
    spec:
      {{- include "osdu-spi-init.podSpec" $ | nindent 6 }}
      containers:
        - name: init
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - python
            - /scripts/init_members.py
          env:
            - name: PARTITION
              value: {{ $partition | quote }}
            - name: MEMBERS
              value: {{ $members | join "," | quote }}
            - name: MEMBER_USERS
              value: {{ $memberUsers | join "," | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop: [ALL]
{{- end }}
{{- end }}
