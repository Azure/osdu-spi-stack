# One Job per partition, adding each member to the root entitlement groups.
# The name hashes the member list and the seed generation so a changed list
# or a changed seed renders a new Job; templates.entitlements_members_job_name
# computes the same name.
{{- if and .Values.membersEnabled .Values.entitlementsMembers }}
{{- $members := .Values.entitlementsMembers | sortAlpha }}
{{- $hash := printf "%s#%v" ($members | join ",") .Values.membersGeneration | sha256sum | trunc 8 }}
{{- range $partition := .Values.partitions }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: entitlements-members-{{ $partition }}-{{ $hash }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "osdu-spi-init.labels" $ | nindent 4 }}
    app.kubernetes.io/component: entitlements-members
    osdu.spi/partition: {{ $partition }}
spec:
  backoffLimit: {{ $.Values.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "osdu-spi-init.labels" $ | nindent 8 }}
        app.kubernetes.io/component: entitlements-members
        osdu.spi/partition: {{ $partition }}
        azure.workload.identity/use: "true"
    spec:
      {{- include "osdu-spi-init.podSpec" $ | nindent 6 }}
      containers:
        - name: init
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - python
            - /scripts/init_members.py
          env:
            - name: PARTITION
              value: {{ $partition | quote }}
            - name: MEMBERS
              value: {{ $members | join "," | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop: [ALL]
{{- end }}
{{- end }}
