{{- if .Values.coreEnabled }}
# One partition.json key per partition, mounted by partition-init at
# /partition-records.
#
# Values of `sensitive: true` properties are bare Key Vault secret suffixes:
# partition-azure prefixes the partition id at write time, so "cosmos-endpoint"
# is stored as "{partition}-cosmos-endpoint". A prefix here would double it.
# The connection-string and storage-key secrets hold the literal "DISABLED";
# Workload Identity supplies credentials at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osdu-spi-init-partition-records
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "osdu-spi-init.labels" . | nindent 4 }}
data:
{{- range $partition := .Values.partitions }}
  {{ $partition }}.json: |
    {
      "properties": {
        "compliance-ruleset": {
          "sensitive": false,
          "value": "shared"
        },
        "cosmos-connection": {
          "sensitive": true,
          "value": "cosmos-connection"
        },
        "cosmos-endpoint": {
          "sensitive": true,
          "value": "cosmos-endpoint"
        },
        "cosmos-primary-key": {
          "sensitive": true,
          "value": "cosmos-primary-key"
        },
        "sb-connection": {
          "sensitive": true,
          "value": "sb-connection"
        },
        "sb-namespace": {
          "sensitive": true,
          "value": "sb-namespace"
        },
        "storage-account-key": {
          "sensitive": true,
          "value": "storage-account-key"
        },
        "storage-account-name": {
          "sensitive": true,
          "value": "storage"
        },
        "storage-account-blob-endpoint": {
          "sensitive": true,
          "value": "storage-account-blob-endpoint"
        },
        "elastic-endpoint": {
          "sensitive": true,
          "value": "elastic-endpoint"
        },
        "elastic-username": {
          "sensitive": true,
          "value": "elastic-username"
        },
        "elastic-password": {
          "sensitive": true,
          "value": "elastic-password"
        },
        "elastic-ssl-enabled": {
          "sensitive": false,
          "value": "true"
        },
        "indexer-decimation-enabled": {
          "sensitive": false,
          "value": "true"
        }
      }
    }
{{- end }}
{{- end }}
