{{- if .Values.coreEnabled }}
# One Job per partition. POSTs the partition record from
# osdu-spi-init-partition-records, or PATCHes it onto a record that already
# exists. The name carries a hash of the record so a changed record reruns
# the Job; the CLI does not compute this name, status finds it by label.
{{- $recordHash := include "osdu-spi-init.partitionRecord" . | sha256sum | trunc 8 }}
{{- range $partition := .Values.partitions }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: partition-init-{{ $partition }}-{{ $recordHash }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "osdu-spi-init.labels" $ | nindent 4 }}
    app.kubernetes.io/component: partition-init
    osdu.spi/partition: {{ $partition }}
spec:
  backoffLimit: {{ $.Values.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "osdu-spi-init.labels" $ | nindent 8 }}
        app.kubernetes.io/component: partition-init
        osdu.spi/partition: {{ $partition }}
        azure.workload.identity/use: "true"
    spec:
      {{- include "osdu-spi-init.podSpec" $ | nindent 6 }}
      containers:
        - name: init
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - python
            - /scripts/init_partition.py
          env:
            - name: PARTITION
              value: {{ $partition | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: partition-records
              mountPath: /partition-records
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop: [ALL]
{{- end }}
{{- end }}
