{{- if .Values.coreEnabled }}
# Scripts shared by the init Jobs. auth.py exchanges the webhook-injected
# federated token for a bearer whose appid is the OSDU UAMI; partition-azure
# stores that appid as TenantInfo.service-account and entitlements authorises
# it as bootstrap admin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osdu-spi-init-scripts
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "osdu-spi-init.labels" . | nindent 4 }}
data:
  auth.py: |
    """Workload Identity federated-token exchange for a v1.0 Azure AD token.

    OSDU services (entitlements-azure, partition-azure) read the caller's
    application id from the v1.0 `appid` claim. The Microsoft Identity v2.0
    endpoint emits `azp` instead and omits `appid`, so a token from
    MSAL.acquire_token_for_client(scopes=[".../.default"]) is rejected as
    "app-id=" by the OSDU log filter and fails authorization.

    We therefore POST directly to the v1.0 endpoint
    /{tenant}/oauth2/token with resource=https://management.azure.com/.
    The response carries `appid` and authorization succeeds.
    """
    import json
    import os
    import urllib.parse
    import urllib.request


    def get_token(resource: str = "https://management.azure.com/") -> str:
        tenant_id = os.environ["AZURE_TENANT_ID"]
        client_id = os.environ["AZURE_CLIENT_ID"]
        token_path = os.environ.get(
            "AZURE_FEDERATED_TOKEN_FILE",
            "/var/run/secrets/azure/tokens/azure-identity-token",
        )
        with open(token_path, "r") as fh:
            federated_token = fh.read().strip()

        data = urllib.parse.urlencode({
            "grant_type": "client_credentials",
            "client_id": client_id,
            "client_assertion_type": (
                "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
            ),
            "client_assertion": federated_token,
            "resource": resource,
        }).encode()
        req = urllib.request.Request(
            f"https://login.microsoftonline.com/{tenant_id}/oauth2/token",
            data=data,
            method="POST",
            headers={"Content-Type": "application/x-www-form-urlencoded"},
        )
        try:
            resp = urllib.request.urlopen(req, timeout=60)
            payload = json.loads(resp.read())
        except urllib.error.HTTPError as e:
            raise SystemExit(
                f"Token acquisition failed: {e.code} {e.read().decode(errors='replace')}"
            )
        if "access_token" not in payload:
            raise SystemExit(f"Token acquisition failed: {payload}")
        return payload["access_token"]
  wait.py: |
    """Poll an HTTP endpoint until it returns an expected status code."""
    import sys
    import time
    import urllib.request


    def wait_for_status(
        url: str,
        expected: set,
        attempts: int,
        delay: float,
        headers: dict | None = None,
        timeout: float = 5.0,
    ) -> bool:
        req = urllib.request.Request(url, headers=headers or {})
        for i in range(1, attempts + 1):
            try:
                code = urllib.request.urlopen(req, timeout=timeout).getcode()
            except urllib.error.HTTPError as e:
                code = e.code
            except Exception:
                code = 0
            if code in expected:
                print(f"  {url} -> {code} (after {i} attempt(s))")
                return True
            if i == 1 or i % 30 == 0:
                print(f"  {url} -> {code} (attempt {i}/{attempts})")
            time.sleep(delay)
        print(f"ERROR: {url} did not return {expected} after {attempts} attempts")
        return False
  init_partition.py: |
    """Register a partition record with the partition service.

    Flow:
      1. Wait for partition service /info to return 200.
      2. Acquire a bearer token via Workload Identity.
      3. POST /api/partition/v1/partitions/<PARTITION> with the partition
         record body from /partition-records/<PARTITION>.json.
      4. On 409 (already exists) PATCH the same properties onto the record,
         so a property added to the template reaches an existing partition.
    """
    import json
    import os
    import sys
    import urllib.request

    sys.path.insert(0, "/scripts")
    from auth import get_token
    from wait import wait_for_status

    PARTITION = os.environ["PARTITION"]
    PARTITION_HOST = os.environ.get(
        "PARTITION_HOST", "http://partition.osdu.svc.cluster.local"
    )
    RECORD_PATH = f"/partition-records/{PARTITION}.json"

    INFO_URL = f"{PARTITION_HOST}/api/partition/v1/info"
    POST_URL = f"{PARTITION_HOST}/api/partition/v1/partitions/{PARTITION}"


    def send(method: str, body: str, token: str) -> tuple[int, str]:
        req = urllib.request.Request(
            POST_URL,
            data=body.encode(),
            method=method,
            headers={
                "Content-Type": "application/json",
                "Accept": "application/json",
                "Authorization": f"Bearer {token}",
                "data-partition-id": PARTITION,
            },
        )
        try:
            resp = urllib.request.urlopen(req, timeout=60)
            code, payload = resp.getcode(), resp.read().decode(errors="replace")
        except urllib.error.HTTPError as e:
            code, payload = e.code, e.read().decode(errors="replace")
        print(f"  {method} {POST_URL} -> {code}")
        if payload:
            print(payload)
        return code, payload


    def main() -> int:
        print(f"Partition bootstrap for '{PARTITION}'")

        if not wait_for_status(INFO_URL, {200}, attempts=600, delay=2.0):
            return 1

        with open(RECORD_PATH, "r") as fh:
            body = fh.read()
        print(f"  Loaded partition record from {RECORD_PATH}")

        print("  Acquiring bearer token via Workload Identity...")
        token = get_token()

        code, _ = send("POST", body, token)
        if code in (200, 201):
            return 0
        if code != 409:
            return 1
        # The service rejects an update naming id, which it added at create time.
        properties = json.loads(body)["properties"]
        properties.pop("id", None)
        print("  Partition already exists; updating its properties.")
        code, _ = send("PATCH", json.dumps({"properties": properties}), token)
        return 0 if code in (200, 204) else 1


    if __name__ == "__main__":
        sys.exit(main())
  init_entitlements.py: |
    """Seed entitlements root groups for a partition.

    Partition creation and the entitlements partition cache converge
    asynchronously. Retry tenant provisioning while entitlements reports that
    the partition is not valid, then treat 200 and 409 as success.
    """
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    sys.path.insert(0, "/scripts")
    from auth import get_token
    from wait import wait_for_status

    PARTITION = os.environ["PARTITION"]
    ENTITLEMENTS_HOST = os.environ.get(
        "ENTITLEMENTS_HOST", "http://entitlements.osdu.svc.cluster.local"
    )

    INFO_URL = f"{ENTITLEMENTS_HOST}/api/entitlements/v2/info"
    POST_URL = f"{ENTITLEMENTS_HOST}/api/entitlements/v2/tenant-provisioning"
    PROVISION_ATTEMPTS = 150
    RETRY_DELAY = 2.0


    def main() -> int:
        print(f"Entitlements bootstrap for '{PARTITION}'")

        if not wait_for_status(INFO_URL, {200}, attempts=600, delay=2.0):
            return 1

        print("  Acquiring bearer token via Workload Identity...")
        token = get_token()

        for attempt in range(1, PROVISION_ATTEMPTS + 1):
            req = urllib.request.Request(
                POST_URL,
                data=b"",
                method="POST",
                headers={
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Authorization": f"Bearer {token}",
                    "data-partition-id": PARTITION,
                },
            )
            try:
                resp = urllib.request.urlopen(req, timeout=120)
                code = resp.getcode()
                payload = resp.read().decode(errors="replace")
            except urllib.error.HTTPError as e:
                code = e.code
                payload = e.read().decode(errors="replace")

            print(f"  POST {POST_URL} -> {code}")
            print(payload)
            if code == 200:
                return 0
            if code == 409:
                print("  Tenant already provisioned; treating as success.")
                return 0
            if code == 403 and "Invalid data partition id" in payload:
                if attempt < PROVISION_ATTEMPTS:
                    print("  Partition is not visible to entitlements yet; retrying...")
                    time.sleep(RETRY_DELAY)
                    continue
            return 1

        return 1


    if __name__ == "__main__":
        sys.exit(main())
  init_legal.py: |
    """Stage the legal COO catalog and create the default legal tag.

    The cimpl-stack legal-bootstrap pattern adapted to Azure: the catalog
    lands as a blob in the partition storage account's
    legal-service-azure-configuration container. legal-azure resolves that
    container name from its AZURE_STORAGE_CONTAINER_NAME env and the account
    from the partition record, so the cimpl step that PATCHes a bucket
    property onto the partition has no Azure equivalent and is dropped.

    Flow:
      1. Wait for legal /info to return 200 and the partition record to
         exist. Both already hold when this Job starts; the gates cover a
         re-run against a partly torn-down cluster.
      2. Resolve the partition's blob endpoint from Key Vault
         ({partition}-storage-account-blob-endpoint), the same sensitive
         property path every service uses.
      3. PUT Legal_COO.json into the legal configuration container
         (overwrite; the upload is idempotent). A staging failure is
         recorded and the run continues: the tag is the deliverable.
      4. Wait until an authenticated GET on /legaltags returns 200: legal
         authorizes against the groups entitlements-init provisions, and
         entitlements and legal each cache their view of them.
      5. POST the default legal tag. 201 is success; on 409 the existing
         tag's properties and legal's own validity verdict must match what
         this Job would have created, or the run fails: a taken name is not
         proof that bootstrap converged. Anything else fails the Job.

    Every exit prints "legal-init outcome: <code>", one of: created,
    already_exists, catalog_not_staged, config_missing, service_timeout,
    partition_record_timeout, legal_authz_timeout, legal_tag_rejected,
    legal_tag_conflict, auth_failed, unexpected_error.
    This Job runs in the non-gating osdu-spi-legal release, never the gating
    osdu-spi-init one (helm-controller waits for every Job in a release), so
    a failure never blocks platform readiness: "ready" and "seeded" stay
    separate signals.
    """
    import json
    import os
    import sys
    import urllib.request
    from email.utils import formatdate

    sys.path.insert(0, "/scripts")
    from auth import get_token
    from wait import wait_for_status

    # Must match AZURE_STORAGE_CONTAINER_NAME in services/legal.yaml; the
    # container is created per partition by infra/modules/partition.bicep.
    CONFIG_CONTAINER = "legal-service-azure-configuration"

    REQUIRED_ENV = ("PARTITION", "LEGAL_TAG", "KEYVAULT_NAME")

    # The Job's activeDeadlineSeconds must cover the worst case of these, or
    # the pod dies before printing an outcome: each poll attempt costs
    # WAIT_DELAY plus WAIT_SOCKET_TIMEOUT, and REQUEST_BUDGET covers eight
    # 60 s calls.
    WAIT_DELAY = 2.0
    WAIT_SOCKET_TIMEOUT = 5.0
    REQUEST_TIMEOUT = 60
    REQUEST_BUDGET = 480
    LEGAL_INFO_ATTEMPTS = 200
    PARTITION_RECORD_ATTEMPTS = 120
    LEGAL_AUTHZ_ATTEMPTS = 100

    # Overrides entries in legal's DefaultCountryCode.json. Malaysia must stay
    # "Client consent required": the legal acceptance suite creates MY tags
    # expecting 201 and reads this blob when it is present.
    COO_CATALOG = [
        {
            "name": "United States of America",
            "alpha2": "US",
            "numeric": 840,
            "residencyRisk": "No restriction",
        },
        {
            "name": "Malaysia",
            "alpha2": "MY",
            "numeric": 458,
            "residencyRisk": "Client consent required",
        },
    ]


    def outcome(code: str) -> None:
        print(f"legal-init outcome: {code}")


    def tag_body(legal_tag: str) -> dict:
        return {
            "name": legal_tag,
            "description": "Default legal tag for sample data",
            "properties": {
                "countryOfOrigin": ["US"],
                "contractId": "No Contract Related",
                "expirationDate": "2099-01-01",
                "dataType": "Public Domain Data",
                "originator": "OSDU",
                "securityClassification": "Public",
                "exportClassification": "EAR99",
                "personalData": "No Personal Data",
            },
        }


    def properties_drift(existing: dict, desired: dict) -> list:
        """Property names where an existing tag differs from the one we POST.

        Legal normalizes on write (countryOfOrigin upper-cased, originator
        trimmed, expirationDate serialized yyyy-MM-dd), so comparing the
        stripped values it returns against what we send is exact.
        """
        drift = []
        for key, want in desired.items():
            have = existing.get(key)
            if isinstance(want, list):
                same = sorted(str(v).strip().upper() for v in have or []) == sorted(
                    str(v).strip().upper() for v in want
                )
            else:
                same = str(have or "").strip() == str(want)
            if not same:
                drift.append(key)
        return drift


    def verify_existing_tag(legal_host: str, legal_tag: str, headers: dict) -> str:
        """Why a same-name tag is not the tag bootstrap requires, or "".

        A 409 proves the name is taken, not that it names a usable tag, so
        compare the stored properties and ask legal for its own validity
        verdict (which covers expiry) before reporting convergence.
        """
        try:
            req = urllib.request.Request(
                f"{legal_host}/api/legal/v1/legaltags/{legal_tag}", headers=headers
            )
            resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
            existing = json.loads(resp.read()).get("properties") or {}
            drift = properties_drift(existing, tag_body(legal_tag)["properties"])
            if drift:
                return f"properties differ: {', '.join(drift)}"

            req = urllib.request.Request(
                f"{legal_host}/api/legal/v1/legaltags:validate",
                data=json.dumps({"names": [legal_tag]}).encode(),
                method="POST",
                headers={"Content-Type": "application/json", **headers},
            )
            resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
            invalid = json.loads(resp.read()).get("invalidLegalTags") or []
        except urllib.error.HTTPError as e:
            return f"verification failed -> {e.code}: {e.read().decode(errors='replace')}"
        except Exception as e:
            return f"verification failed -> {type(e).__name__}: {e}"
        if invalid:
            return "; ".join(f"{i.get('name')}: {i.get('reason')}" for i in invalid)
        return ""


    def resolve_blob_endpoint(keyvault_name: str, partition: str) -> str:
        token = get_token(resource="https://vault.azure.net")
        url = (
            f"https://{keyvault_name}.vault.azure.net/secrets/"
            f"{partition}-storage-account-blob-endpoint?api-version=7.4"
        )
        req = urllib.request.Request(
            url, headers={"Authorization": f"Bearer {token}"}
        )
        resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
        return json.loads(resp.read())["value"].rstrip("/")


    def upload_catalog(blob_endpoint: str) -> int:
        token = get_token(resource="https://storage.azure.com/")
        req = urllib.request.Request(
            f"{blob_endpoint}/{CONFIG_CONTAINER}/Legal_COO.json",
            data=json.dumps(COO_CATALOG).encode(),
            method="PUT",
            headers={
                "Authorization": f"Bearer {token}",
                # Storage rejects a bearer-authorized request with no date.
                "x-ms-date": formatdate(usegmt=True),
                "x-ms-version": "2021-08-06",
                "x-ms-blob-type": "BlockBlob",
                "Content-Type": "application/json",
            },
        )
        resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
        return resp.getcode()


    def main() -> int:
        missing = [name for name in REQUIRED_ENV if not os.environ.get(name)]
        if missing:
            print(f"ERROR: missing environment: {', '.join(missing)}")
            outcome("config_missing")
            return 1

        partition = os.environ["PARTITION"]
        legal_tag = os.environ["LEGAL_TAG"]
        keyvault_name = os.environ["KEYVAULT_NAME"]
        legal_host = os.environ.get("LEGAL_HOST", "http://legal.osdu.svc.cluster.local")
        partition_host = os.environ.get(
            "PARTITION_HOST", "http://partition.osdu.svc.cluster.local"
        )
        info_url = f"{legal_host}/api/legal/v1/info"
        partition_get_url = f"{partition_host}/api/partition/v1/partitions/{partition}"
        legaltags_url = f"{legal_host}/api/legal/v1/legaltags"

        print(f"Legal bootstrap for '{partition}' (tag: {legal_tag})")

        if not wait_for_status(
            info_url,
            {200},
            attempts=LEGAL_INFO_ATTEMPTS,
            delay=WAIT_DELAY,
            timeout=WAIT_SOCKET_TIMEOUT,
        ):
            outcome("service_timeout")
            return 1
        if not wait_for_status(
            partition_get_url,
            {200, 401, 403},
            attempts=PARTITION_RECORD_ATTEMPTS,
            delay=WAIT_DELAY,
            timeout=WAIT_SOCKET_TIMEOUT,
        ):
            outcome("partition_record_timeout")
            return 1

        catalog_staged = True
        print("  Resolving the partition blob endpoint from Key Vault...")
        try:
            blob_endpoint = resolve_blob_endpoint(keyvault_name, partition)
            print(f"  Uploading Legal_COO.json to {CONFIG_CONTAINER}...")
            print(f"  PUT Legal_COO.json -> {upload_catalog(blob_endpoint)}")
        except urllib.error.HTTPError as e:
            print(f"  Catalog staging -> {e.code}: {e.read().decode(errors='replace')}")
            catalog_staged = False
        except Exception as e:
            # SystemExit from get_token escapes on purpose: an unusable token
            # is not staging-local, so the run ends on auth_failed.
            print(f"  Catalog staging -> {type(e).__name__}: {e}")
            catalog_staged = False
        if not catalog_staged:
            print("  Continuing to the tag POST; the tag is the deliverable.")

        print("  Acquiring bearer token via Workload Identity...")
        token = get_token()
        auth_headers = {
            "Authorization": f"Bearer {token}",
            "data-partition-id": partition,
        }

        print("  Waiting for legal to authorize the bootstrap identity...")
        if not wait_for_status(
            legaltags_url,
            {200},
            attempts=LEGAL_AUTHZ_ATTEMPTS,
            delay=WAIT_DELAY,
            timeout=WAIT_SOCKET_TIMEOUT,
            headers=auth_headers,
        ):
            outcome("legal_authz_timeout")
            return 1

        req = urllib.request.Request(
            legaltags_url,
            data=json.dumps(tag_body(legal_tag)).encode(),
            method="POST",
            headers={
                "Content-Type": "application/json",
                "Accept": "application/json",
                **auth_headers,
            },
        )
        tag_outcome = None
        try:
            resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
            code = resp.getcode()
            print(f"  POST {legaltags_url} -> {code}")
            print(resp.read().decode(errors="replace"))
            if code == 201:
                tag_outcome = "created"
        except urllib.error.HTTPError as e:
            print(f"  POST {legaltags_url} -> {e.code}")
            print(e.read().decode(errors="replace"))
            if e.code == 409:
                print(f"  Tag '{legal_tag}' exists; verifying it is the required tag...")
                conflict = verify_existing_tag(legal_host, legal_tag, auth_headers)
                if conflict:
                    print(f"  Existing tag is not the required tag -> {conflict}")
                    outcome("legal_tag_conflict")
                    return 1
                print("  Existing tag matches and validates; treating as success.")
                tag_outcome = "already_exists"

        if tag_outcome is None:
            outcome("legal_tag_rejected")
            return 1
        if not catalog_staged:
            outcome("catalog_not_staged")
            return 1
        outcome(tag_outcome)
        return 0


    if __name__ == "__main__":
        try:
            rc = main()
        except SystemExit as e:
            print(f"ERROR: {e}")
            outcome("auth_failed")
            rc = 1
        except Exception as e:
            print(f"ERROR: {type(e).__name__}: {e}")
            outcome("unexpected_error")
            rc = 1
        sys.exit(rc)
  init_members.py: |
    """Add the environment's test callers to their entitlement groups.

    The deploy identity fork CI authenticates as is unknown to
    entitlements until something adds it, so every acceptance request it
    mints would fail authorization. This Job runs as the workload identity,
    which tenant-provisioning made OWNER of the root groups, and adds each
    configured member as x-user-id to users, users.datalake.ops,
    users.datalake.admins, users.data.root, and users.datalake.delegation
    for the partition. Each configured member user, the test caller who is
    no data manager, is added to users, to every service.<name>.user group the
    listing carries, and to the fixed MEMBER_USER_GROUPS, and nothing else.

    The Azure provider's tenant-provisioning does not create the two
    impersonation groups the core defines, users.datalake.delegation (who may
    impersonate) and users.datalake.impersonation (who may be impersonated).
    The entitlements acceptance suite requires both, so the Job creates them
    when absent; the creator is their OWNER and ops membership lets any
    configured member manage them afterwards.

    Flow:
      1. Wait for entitlements /info to return 200.
      2. GET /groups as the owner; the email domain is whatever entitlements
         was deployed with. With member users, refuse before any write when
         the listing carries more than MAX_USER_GROUPS service.<name>.user
         groups or lacks one of MEMBER_USER_GROUPS.
      3. POST /groups for each impersonation group the listing lacks.
      4. Select the five root groups by name, and users, every
         service.<name>.user group, and MEMBER_USER_GROUPS for the member users.
      5. POST each principal to each of its groups. 200 adds, 409 is
         already a member.
      6. GET each group's members back and require every principal present.

    Every exit prints "entitlements-members outcome: <code>", one of: seeded,
    already_member, group_missing, group_rejected, member_rejected,
    verify_failed, too_many_user_groups, config_missing, service_timeout,
    auth_failed, unexpected_error, and
    writes the same line, with the failure detail, to the pod termination
    message so spi status can name the member and group that failed.
    The Job renders only in the non-gating osdu-spi-members release; spi
    status reports its failure as a bootstrap blocker rather than
    letting Flux hold the whole init layer for it.
    """
    import json
    import os
    import re
    import sys
    import urllib.error
    import urllib.request

    sys.path.insert(0, "/scripts")
    from auth import get_token
    from wait import wait_for_status

    ROOT_GROUPS = (
        "users",
        "users.datalake.ops",
        "users.datalake.admins",
        "users.data.root",
        "users.datalake.delegation",
    )
    CREATED_GROUPS = {
        "users.datalake.delegation": "Users who can impersonate",
        "users.datalake.impersonation": "Users who can be impersonated",
    }
    MEMBER_USER_GROUP_RE = re.compile(r"^service\.[a-z0-9-]+\.user$")
    # Storage defines no .user group; its suite declares the member caller with admin.
    MEMBER_USER_GROUPS = ("service.storage.admin",)
    # Azure's tenant provisioning creates 7 service.<name>.user groups and
    # other OSDU services define a further 7; 16 covers that known set with
    # headroom, and bounds REQUEST_BUDGET below.
    MAX_USER_GROUPS = 16
    REQUIRED_ENV = ("PARTITION", "MEMBERS")
    # The Job's activeDeadlineSeconds must cover the worst case or the pod dies
    # before printing an outcome: each poll attempt costs WAIT_DELAY plus
    # WAIT_SOCKET_TIMEOUT; REQUEST_BUDGET covers the 60 s token exchange,
    # thirteen 30 s calls for the one member the CLI seeds (one listing, two
    # creates, then a write and a read per root group), and up to
    # MAX_USER_GROUPS plus len(MEMBER_USER_GROUPS) more write-and-read pairs
    # plus a users write for the one member user.
    REQUEST_TIMEOUT = 30
    REQUEST_BUDGET = 1500
    INFO_ATTEMPTS = 30
    WAIT_DELAY = 2.0
    WAIT_SOCKET_TIMEOUT = 5.0
    TERMINATION_MESSAGE_PATH = os.environ.get(
        "TERMINATION_MESSAGE_PATH", "/dev/termination-log"
    )


    def outcome(code: str, detail: str = "") -> None:
        if detail:
            print(f"ERROR: {detail}")
        line = f"entitlements-members outcome: {code}"
        print(line)
        try:
            with open(TERMINATION_MESSAGE_PATH, "w") as handle:
                handle.write(f"{line}: {detail}" if detail else line)
        except OSError:
            pass


    def request(url: str, headers: dict, method: str = "GET", body: dict | None = None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers=headers)
        try:
            resp = urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT)
            code, payload = resp.getcode(), resp.read().decode(errors="replace")
        except urllib.error.HTTPError as e:
            code, payload = e.code, e.read().decode(errors="replace")
        print(f"  {method} {url} -> {code}")
        return code, payload


    def parse(payload: str) -> dict:
        try:
            parsed = json.loads(payload) if payload else {}
        except json.JSONDecodeError:
            return {}
        return parsed if isinstance(parsed, dict) else {}


    def main() -> int:
        missing = [name for name in REQUIRED_ENV if not os.environ.get(name)]
        if missing:
            outcome("config_missing", f"missing environment: {', '.join(missing)}")
            return 1
        partition = os.environ["PARTITION"]
        members = sorted({m.strip() for m in os.environ["MEMBERS"].split(",") if m.strip()})
        member_users = sorted(
            {m.strip() for m in os.environ.get("MEMBER_USERS", "").split(",") if m.strip()}
        )
        host = os.environ.get("ENTITLEMENTS_HOST", "http://entitlements.osdu.svc.cluster.local")
        base = f"{host}/api/entitlements/v2"
        print(f"Entitlements members for '{partition}': {', '.join(members)}")
        if member_users:
            print(f"Entitlements member users for '{partition}': {', '.join(member_users)}")

        if not wait_for_status(
            f"{base}/info",
            {200},
            attempts=INFO_ATTEMPTS,
            delay=WAIT_DELAY,
            timeout=WAIT_SOCKET_TIMEOUT,
        ):
            outcome("service_timeout", "entitlements /info did not answer 200")
            return 1

        print("  Acquiring bearer token via Workload Identity...")
        headers = {
            "Authorization": f"Bearer {get_token()}",
            "Accept": "application/json",
            "Content-Type": "application/json",
            "data-partition-id": partition,
        }

        code, payload = request(f"{base}/groups", headers)
        if code != 200:
            print(payload)
            outcome("group_missing", f"GET /groups returned {code} for the owner")
            return 1
        emails = {}
        for group in parse(payload).get("groups") or []:
            if isinstance(group, dict) and group.get("name"):
                emails[group["name"]] = group.get("email", "")
        matched_groups = sorted(n for n in emails if MEMBER_USER_GROUP_RE.match(n))
        if member_users and len(matched_groups) > MAX_USER_GROUPS:
            outcome(
                "too_many_user_groups",
                f"{len(matched_groups)} service user groups exceed the "
                f"{MAX_USER_GROUPS} the deadline budgets for; "
                f"{', '.join(member_users)} not seeded",
            )
            return 1
        absent_user_groups = [name for name in MEMBER_USER_GROUPS if not emails.get(name)]
        if member_users and absent_user_groups:
            outcome(
                "group_missing",
                f"member user groups not visible to the owner: {', '.join(absent_user_groups)}; "
                f"{', '.join(member_users)} not seeded",
            )
            return 1
        for name, description in CREATED_GROUPS.items():
            if emails.get(name):
                continue
            code, payload = request(
                f"{base}/groups", headers, "POST", {"name": name, "description": description}
            )
            if code in (200, 201):
                emails[name] = parse(payload).get("email", "")
            elif code == 409:
                print(f"  {name} already exists")
            else:
                print(payload)
                outcome("group_rejected", f"{name} was not created ({code})")
                return 1
            if not emails.get(name) and emails.get("users", "").startswith("users@"):
                emails[name] = f"{name}@{emails['users'].split('@', 1)[1]}"
        absent = [name for name in ROOT_GROUPS if not emails.get(name)]
        if absent:
            outcome(
                "group_missing",
                f"root groups not visible to the owner: {', '.join(absent)}; "
                f"{', '.join(members)} not seeded",
            )
            return 1

        user_groups = ["users"] + matched_groups + list(MEMBER_USER_GROUPS)
        seeds = [(member, name) for member in members for name in ROOT_GROUPS]
        seeds += [(member, name) for member in member_users for name in user_groups]

        added = False
        for member, name in seeds:
            url = f"{base}/groups/{emails[name]}/members"
            code, payload = request(url, headers, "POST", {"email": member, "role": "MEMBER"})
            if code == 200:
                added = True
            elif code == 409:
                print(f"  {member} is already a member of {emails[name]}")
            else:
                print(payload)
                outcome("member_rejected", f"{member} was not added to {emails[name]} ({code})")
                return 1

        listings = {}
        for member, name in seeds:
            if name not in listings:
                code, payload = request(f"{base}/groups/{emails[name]}/members", headers)
                listings[name] = (
                    {
                        str(m.get("email", "")).lower()
                        for m in parse(payload).get("members") or []
                        if isinstance(m, dict)
                    }
                    if code == 200
                    else None
                )
            present = listings[name]
            if present is None or member.lower() not in present:
                outcome("verify_failed", f"{member} is not a member of {emails[name]} after seeding")
                return 1

        outcome("seeded" if added else "already_member")
        return 0


    if __name__ == "__main__":
        try:
            rc = main()
        except SystemExit as e:
            outcome("auth_failed", str(e))
            rc = 1
        except Exception as e:
            outcome("unexpected_error", f"{type(e).__name__}: {e}")
            rc = 1
        sys.exit(rc)
