# -- Partitions to bootstrap. Flux injects the CLI-written spi-init-values
#    ConfigMap; this default only serves a local helm template.
partitions:
  - opendes

# -- Base name of the default legal tag, created per partition as
#    "{partition}-{legalTag}". Must match templates.LEGAL_TAG_BASE in the CLI.
legalTag: demo-legaltag

# -- Component toggles. The osdu-spi-init release renders only the core
#    Jobs, osdu-spi-legal only the legal Jobs, and osdu-spi-members only the
#    members Jobs; all default on so helm template and the render tests see
#    every manifest.
coreEnabled: true
legalEnabled: true
membersEnabled: true

# -- Principals entitlements-members adds to the root groups, as the
#    x-user-id each presents. The CLI writes the deploy identity here
#    through spi-init-values; no Job renders while the list is empty.
entitlementsMembers: []

# -- Principals entitlements-members adds to users and every service.<name>.user
#    group only: the environment's member identity, the non-admin test caller.
entitlementsMemberUsers: []

# -- Bumped when entitlements-members seeds something new, so an environment
#    whose member list is unchanged still renders a fresh Job. Must equal
#    ENTITLEMENTS_MEMBERS_GENERATION in the CLI, which computes the Job name.
membersGeneration: 2

# -- Namespace where the Jobs run; the CLI bootstrap creates
#    workload-identity-sa here.
namespace: osdu

# -- Base image for the Jobs. The scripts authenticate with urllib against the
#    v1.0 token endpoint, so the image needs nothing beyond the standard library.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

# -- Service account for every Job pod; the Workload Identity webhook injects
#    the AZURE_* variables when the pod carries azure.workload.identity/use.
serviceAccountName: workload-identity-sa

# -- Jobs run on the osdu nodepool alongside the services.
nodeSelector:
  spi-pool: osdu

tolerations:
  - key: workload
    operator: Equal
    value: "osdu"
    effect: NoSchedule

# -- Resources for the init script container. Deployment Safeguards raises a
#    Job's CPU request to 100m; requesting less wedges every later upgrade
#    against the immutable pod template.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- activeDeadlineSeconds for the core Jobs, a few HTTP POSTs.
activeDeadlineSeconds: 600

# -- activeDeadlineSeconds for the legal Jobs. init_legal.py's worst case is
#    3300 s; test_legal_init_deadline_covers_its_wait_budget recomputes it.
legalActiveDeadlineSeconds: 3600

# -- activeDeadlineSeconds for the members Jobs. init_members.py's worst case
#    is 1650 s; test_members_deadline_covers_its_wait_budget recomputes it.
membersActiveDeadlineSeconds: 1800

# -- The scripts treat 409 as success, so a retried failure is a real error.
backoffLimit: 2
