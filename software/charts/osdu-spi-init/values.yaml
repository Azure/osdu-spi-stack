# -- Partitions to bootstrap. Flux injects the CLI-written spi-init-values
#    ConfigMap; this default only serves a local helm template.
partitions:
  - opendes

# -- Base name of the default legal tag, created per partition as
#    "{partition}-{legalTag}". Must match templates.LEGAL_TAG_BASE in the CLI.
legalTag: demo-legaltag

# -- Component toggles. The osdu-spi-init release renders only the core
#    Jobs and osdu-spi-legal only the legal Jobs; both default on so helm
#    template and the render tests see every manifest.
coreEnabled: true
legalEnabled: true

# -- Namespace where the Jobs run; the CLI bootstrap creates
#    workload-identity-sa here.
namespace: osdu

# -- Base image for the Jobs. An initContainer pip-installs msal into a
#    shared emptyDir, which avoids coupling to the schema-load image tag.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

# -- Service account for every Job pod; the Workload Identity webhook injects
#    the AZURE_* variables when the pod carries azure.workload.identity/use.
serviceAccountName: workload-identity-sa

# -- Jobs run on the osdu nodepool alongside the services.
nodeSelector:
  spi-pool: osdu

tolerations:
  - key: workload
    operator: Equal
    value: "osdu"
    effect: NoSchedule

# -- Resources for the init script container.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- activeDeadlineSeconds for the core Jobs, a few HTTP POSTs.
activeDeadlineSeconds: 600

# -- activeDeadlineSeconds for the legal Jobs. init_legal.py's worst case is
#    3300 s; test_legal_init_deadline_covers_its_wait_budget recomputes it.
legalActiveDeadlineSeconds: 3600

# -- The scripts treat 409 as success, so a retried failure is a real error.
backoffLimit: 2
