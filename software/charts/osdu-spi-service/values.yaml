image:
  repository: ""
  tag: "latest"
  # -- Rendered as repository@digest when set, repository:tag when empty.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

containerPort: 8080

# -- Created by the CLI bootstrap.
serviceAccountName: workload-identity-sa

# -- Mounted as envFrom; created by the CLI bootstrap.
configMapRef: osdu-config

service:
  type: ClusterIP
  port: 80

probes:
  liveness:
    path: /actuator/health
    port: 8081
    initialDelaySeconds: 250
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health
    port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 300m
    memory: 896Mi
  limits:
    cpu: "1"
    memory: 1536Mi

env: []

initContainers: []

volumeMounts: []

volumes: []

# -- Stamps the azure.workload.identity/use pod label.
workloadIdentity: true

# -- Import the Elasticsearch CA into the Java truststore (search, indexer).
elasticTls: false

# -- Import the Redis CA into the Java truststore.
redisTls: false

topologySpread: true

# -- Set by values override when nodepool isolation is enabled.
nodeSelector: {}
tolerations: []

istioProxyPin:
  enabled: false
  image: mcr.microsoft.com/oss/v2/istio/proxyv2:v1.28.3-2
