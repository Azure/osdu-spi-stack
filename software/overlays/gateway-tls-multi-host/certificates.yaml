# Certificates live in platform: the protect-system-namespaces policy denies
# cert-manager's status writes in aks-istio-ingress, silently stalling
# issuance. The ReferenceGrant lets the Gateway read the secrets.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: osdu-tls
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  secretName: osdu-tls
  dnsNames:
    - "${INGRESS_HOST_OSDU}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-tls
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  secretName: kibana-tls
  dnsNames:
    - "${INGRESS_HOST_KIBANA}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: airflow-tls
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  secretName: airflow-tls
  dnsNames:
    - "${INGRESS_HOST_AIRFLOW}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-tls-secrets
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: aks-istio-ingress
  to:
    - group: ""
      kind: Secret
      name: osdu-tls
    - group: ""
      kind: Secret
      name: kibana-tls
    - group: ""
      kind: Secret
      name: airflow-tls
