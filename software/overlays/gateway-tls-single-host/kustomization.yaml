apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Azure-mode overlay: the base gateway plus one HTTPS:443 listener on the
# auto-FQDN with a Let's Encrypt cert.
resources:
  - ../../components/gateway
  - certificate.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: spi-gateway
    patch: |
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          protocol: HTTPS
          port: 443
          hostname: "${INGRESS_FQDN}"
          tls:
            mode: Terminate
            # The ReferenceGrant in certificate.yaml authorizes this
            # cross-namespace read.
            certificateRefs:
              - name: osdu-tls
                namespace: platform
          allowedRoutes:
            namespaces:
              from: All
