apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Azure-mode overlay: the base gateway plus the DNS label on its generated
# Service and one HTTPS:443 listener on the auto-FQDN with a Let's Encrypt cert.
resources:
  - ../../components/gateway
  - certificate.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: spi-gateway
      namespace: platform
    patch: |
      - op: add
        path: /spec/infrastructure
        value:
          annotations:
            service.beta.kubernetes.io/azure-dns-label-name: "${DNS_LABEL}"
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          protocol: HTTPS
          port: 443
          hostname: "${INGRESS_FQDN}"
          tls:
            mode: Terminate
            certificateRefs:
              - name: osdu-tls
          allowedRoutes:
            namespaces:
              from: All
