apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: osdu-flux
spec:
  # Chart 1.22 has no DAG processor readiness probe. Without one, pip's
  # running entrypoint is Ready and a failed install can retire the old pod.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: airflow-dag-processor
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  exec:
                    command:
                      - bash
                      - -c
                      - airflow jobs check --job-type DagProcessorJob --local
                  periodSeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 3
  values:
    executor: LocalExecutor
    allowPodLaunching: false
    workers:
      persistence:
        enabled: false
    extraConfigMaps:
      spi-osdu-dag-files:
        useHelmHooks: false
        data: |
          {{- range $name, $content := .Values.spiDagFiles }}
          {{ $name | quote }}: {{ $content | toJson }}
          {{- end }}
    config:
      core:
        parallelism: "2"
        dags_are_paused_at_creation: "true"
        hostname_callable: airflow.utils.net.get_host_ip_address
    scheduler:
      # Probes must not re-enter the image's dependency-installing entrypoint.
      startupProbe:
        failureThreshold: 18
        command:
          - bash
          - -c
          - airflow jobs check --job-type SchedulerJob --local
      livenessProbe:
        command:
          - bash
          - -c
          - airflow jobs check --job-type SchedulerJob --local
      env: &osduEnv
        - name: _PIP_ADDITIONAL_REQUIREMENTS
          value: "-r /opt/spi/osdu/requirements.txt --require-hashes --only-binary :all:"
        - name: CLOUD_PROVIDER
          value: azure
        - name: AZURE_ENABLE_WORKLOAD_IDENTITY
          value: "true"
        - name: AZURE_RESOURCE_ID
          value: "${OSDU_TOKEN_AUDIENCE:=https://management.azure.com}"
        - name: AIRFLOW_VAR_CORE__SERVICE__STORAGE__URL
          value: http://storage.osdu.svc.cluster.local/api/storage/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SEARCH__URL
          value: http://search.osdu.svc.cluster.local/api/search/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SCHEMA__URL
          value: http://schema.osdu.svc.cluster.local/api/schema-service/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__WORKFLOW__URL
          value: http://workflow.osdu.svc.cluster.local/api/workflow/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__ENTITLEMENTS__URL
          value: http://entitlements.osdu.svc.cluster.local/api/entitlements/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__PARTITION__URL
          value: http://partition.osdu.svc.cluster.local/api/partition/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__FILE__URL
          value: http://file.osdu.svc.cluster.local/api/file/v2
      extraVolumes: &osduVolumes
        - name: osdu-dag-files
          configMap:
            name: spi-osdu-dag-files
        - name: osdu-dags
          emptyDir: {}
      extraVolumeMounts: &osduMounts
        - name: osdu-dag-files
          mountPath: /opt/spi/osdu
          readOnly: true
        - name: osdu-dags
          mountPath: /opt/airflow/dags
          readOnly: true
      extraInitContainers: &osduLoader
        - name: load-osdu-dags
          image: apache/airflow:3.2.2
          command: [python, /opt/spi/osdu/load.py]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: osdu-dag-files
              mountPath: /opt/spi/osdu
              readOnly: true
            - name: osdu-dags
              mountPath: /opt/airflow/dags
      serviceAccount:
        create: false
        name: workload-identity-sa
      labels:
        azure.workload.identity/use: "true"
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      resources:
        requests:
          cpu: "${AIRFLOW_SCHEDULER_CPU_REQUEST:=1}"
          memory: "${AIRFLOW_SCHEDULER_MEMORY_REQUEST:=2Gi}"
        limits:
          cpu: "${AIRFLOW_SCHEDULER_CPU_LIMIT:=2}"
          memory: "${AIRFLOW_SCHEDULER_MEMORY_LIMIT:=4Gi}"
    dagProcessor:
      env: *osduEnv
      extraVolumes: *osduVolumes
      extraVolumeMounts: *osduMounts
      extraInitContainers: *osduLoader
      livenessProbe:
        initialDelaySeconds: 180
        failureThreshold: 10
        command:
          - bash
          - -c
          - airflow jobs check --job-type DagProcessorJob --local
      serviceAccount:
        create: true
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      resources:
        requests:
          cpu: "${AIRFLOW_DAG_PROCESSOR_CPU_REQUEST:=250m}"
          memory: "${AIRFLOW_DAG_PROCESSOR_MEMORY_REQUEST:=512Mi}"
        limits:
          cpu: "${AIRFLOW_DAG_PROCESSOR_CPU_LIMIT:=1}"
          memory: "${AIRFLOW_DAG_PROCESSOR_MEMORY_LIMIT:=2Gi}"
    apiServer:
      serviceAccount:
        create: true
