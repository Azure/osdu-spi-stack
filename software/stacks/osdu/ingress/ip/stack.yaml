# SPI Stack - Ingress profile: IP (bare IP, no TLS, debug only)
#
# The base Gateway (HTTP:80) plus hostname-less HTTPRoutes. No issuers,
# ExternalDNS, Kibana, or TLS overlay.
---
# The Gateway: HTTP:80 only. Sole Flux owner of the object.
#
# Named spi-gateway-tls like every non-bare mode, so switching
# --ingress-mode only changes this Kustomization's spec.path. A
# mode-specific name would prune the old child and its MirrorPrune
# deletion would take the Gateway with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway-tls
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/gateway
  prune: true
  wait: true
  timeout: 5m

---
# HTTPRoutes for the OSDU APIs, no hostnames.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-gateway-tls
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/ip-only/osdu
  prune: true
  wait: true
  timeout: 5m
