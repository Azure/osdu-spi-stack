# SPI Stack - Ingress profile: IP (bare IP, no TLS, debug only)
#
# Renders the base Gateway (HTTP:80 only) and wires HTTPRoutes with no
# hostnames to it. Every ingress tree owns its own Gateway so exactly one
# Flux Kustomization ever applies the object; this mode is the
# one that stops at the base component. No cert-manager issuers, no
# ExternalDNS, no Kibana, no TLS overlay.
---
# The Gateway: HTTP:80 only. Sole Flux owner of the object.
#
# Every non-bare mode names this Kustomization spi-gateway-tls, the name
# the TLS modes already carry on live clusters, so switching
# --ingress-mode only changes this object's spec.path. A mode-specific
# name would make the top-level ingress Kustomization prune the old child
# and its MirrorPrune deletion take the Gateway with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway-tls
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/gateway
  prune: true
  wait: true
  timeout: 5m

---
# HTTPRoutes for the OSDU APIs, no hostnames, bound to HTTP:80.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-gateway-tls
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/ip-only/osdu
  prune: true
  wait: true
  timeout: 5m
