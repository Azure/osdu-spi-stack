# SPI Stack - Ingress profile: IP, minimal variant
#
# The base Gateway and nothing else; see kustomization.yaml.
---
# Retired Gateway owner: an empty, non-pruning inventory, so the objects a
# pre-move cluster listed under this name are left in place, including the
# Gateway in aks-istio-ingress that admission denies Flux the delete of.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway-tls
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/inventory-handoff
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 5m

---
# The Gateway: HTTP:80 only. Sole Flux owner of the object.
#
# Named spi-ingress-gateway like every non-bare mode, so switching
# --ingress-mode only changes this Kustomization's spec.path. A
# mode-specific name would prune the old child and its MirrorPrune
# deletion would take the Gateway with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-ingress-gateway
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/gateway
  prune: true
  wait: true
  timeout: 5m
