# SPI Stack - Ingress profile: IP, minimal variant
#
# Only the base Gateway. The ip mode attaches no issuers, Kibana, TLS
# overlay, or middleware routes, and minimal deploys no OSDU services, so
# the HTTP:80 listener routes nothing. The Gateway is still rendered: the
# ingress tree is its sole Flux owner and it provides the Istio ingress
# LoadBalancer. Reach the middleware UIs with `kubectl port-forward`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - stack.yaml
