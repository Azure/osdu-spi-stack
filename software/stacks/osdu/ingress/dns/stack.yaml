# SPI Stack - Ingress profile: DNS (custom domain)
#
# Uses an existing Azure DNS zone in the current subscription.
# ExternalDNS syncs A records from HTTPRoute hostnames.
# gateway-tls-multi-host renders the whole Gateway: HTTP:80 plus three
# HTTPS:443 listeners, one per hostname (osdu / kibana / airflow).
# cert-manager issues a Let's Encrypt cert per subdomain via HTTP-01
# against that same HTTP:80 listener.
#
# Required variables in spi-ingress-config ConfigMap (osdu-flux):
#   ACME_EMAIL, TXT_OWNER_ID, DNS_ZONE, DNS_ZONE_RG, AZURE_TENANT_ID,
#   EXTERNAL_DNS_CLIENT_ID, INGRESS_HOST_OSDU, INGRESS_HOST_KIBANA,
#   INGRESS_HOST_AIRFLOW.

---
# Cert issuers (Let's Encrypt staging + prod).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cert-manager-issuers
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/cert-manager-issuers
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# Temporary ExternalDNS inventory handoff. This Kustomization
# must reconcile once with an empty inventory and pruning disabled.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-external-dns
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/inventory-handoff
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 5m

---
# ExternalDNS, reading HTTPRoute hostnames and syncing A records to
# the Azure DNS zone via Workload Identity. Its chart comes from the
# shared bitnami HelmRepository, so it waits on that source's owner and
# not on Redis, whose runtime health it does not need.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-external-dns-release
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-helm-sources
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/external-dns
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# Kibana serving at root on its own subdomain (no server.basePath).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-kibana
  namespace: osdu-flux
  labels:
    spi-stack.layer: "3"
spec:
  interval: 10m
  dependsOn:
    - name: spi-elasticsearch
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/kibana
  prune: true
  wait: true
  timeout: 10m

---
# The Gateway: HTTP:80 for ACME HTTP-01 plus three HTTPS:443 listeners,
# one per hostname, each with its own cert. The ingress tree is the
# Gateway's sole Flux owner, so no second Kustomization re-applies the
# object.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway-tls
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/overlays/gateway-tls-multi-host
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# HTTPRoutes for the middleware UIs on their own subdomains. Split from
# spi-osdu-routes so it carries no dependency on spi-osdu-services and
# stays reconcilable under the minimal profile.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-middleware-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-airflow
    - name: spi-kibana
    - name: spi-gateway-tls
    - name: spi-external-dns-release
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/multi-host/middleware
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# HTTPRoutes for the OSDU APIs on the osdu subdomain.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-gateway-tls
    - name: spi-external-dns-release
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/multi-host/osdu
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config
