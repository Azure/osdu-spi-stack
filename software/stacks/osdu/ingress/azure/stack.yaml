# SPI Stack - Ingress profile: AZURE (default)
#
# Uses Azure's auto-assigned <label>.<region>.cloudapp.azure.com FQDN.
# CLI patches the Istio ingress LB with service.beta.kubernetes.io/
# azure-dns-label-name=<cluster-name> before this stack reconciles.
# gateway-tls-single-host renders the whole Gateway: HTTP:80 plus an
# HTTPS:443 listener bound to the FQDN. cert-manager issues the Let's
# Encrypt cert via HTTP-01 against that same HTTP:80 listener. All OSDU
# APIs and middleware UIs (Kibana /kibana, Airflow /airflow) live under
# one host.
#
# Required variables in spi-ingress-config ConfigMap (osdu-flux):
#   ACME_EMAIL, INGRESS_FQDN

---
# Cert issuers (Let's Encrypt staging + prod).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cert-manager-issuers
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/cert-manager-issuers
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# Kibana with server.basePath=/kibana so it can serve from a subpath.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-kibana
  namespace: osdu-flux
  labels:
    spi-stack.layer: "3"
spec:
  interval: 10m
  dependsOn:
    - name: spi-elasticsearch
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/overlays/kibana-subpath
  prune: true
  wait: true
  timeout: 10m

---
# The Gateway: HTTP:80 for ACME HTTP-01 plus the HTTPS:443 listener
# bound to the auto-FQDN. The ingress tree is the Gateway's sole Flux
# owner, so no second Kustomization re-applies the object (ADR-012).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/overlays/gateway-tls-single-host
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# HTTPRoutes for the middleware UIs (Kibana /kibana, Airflow /airflow) on
# the single FQDN. Split from spi-osdu-routes so it carries no dependency
# on spi-osdu-services and stays reconcilable under the minimal profile.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-middleware-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-airflow
    - name: spi-kibana
    - name: spi-gateway
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/single-host/middleware
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config

---
# HTTPRoutes for the OSDU APIs on the single FQDN.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-gateway
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/single-host/osdu
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config
