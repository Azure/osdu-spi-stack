# One-shot Job that loads the OSDU shared schemas into the primary
# partition, authenticating through workload-identity-sa. The loader
# image's entrypoint runs bootstrap.sh from /home/osdu/deployments/scripts/azure,
# so the wrapper and Token.py are mounted over that path rather than
# overriding `command`.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
  namespace: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: schema-load
spec:
  backoffLimit: 2
  # Counts from Job activation, before the Pod is scheduled: 1800s for node
  # provisioning, scheduling, and image pull, 2700s for the script's own
  # schema-service wait, and the rest for the throttled load of ~1,386
  # schemas. The Flux Kustomization timeout must exceed this.
  activeDeadlineSeconds: 9000
  # No ttlSecondsAfterFinished: a TTL would let Flux re-apply the deleted
  # Job on its next reconcile. Re-run with kubectl delete job schema-load -n osdu.
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: osdu-spi-stack
        app.kubernetes.io/component: schema-load
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      restartPolicy: Never
      nodeSelector:
        spi-pool: osdu
      tolerations:
        - key: workload
          operator: Equal
          value: "osdu"
          effect: NoSchedule
      volumes:
        - name: scripts
          configMap:
            name: schema-load-scripts
            defaultMode: 0755
      containers:
        - name: loader
          # From the osdu-image-lock ConfigMap, on the same SHA as
          # schema-service. No static default: upstream prunes old tags.
          # `spi reconcile` backfills a lock that predates this key.
          image: ${SCHEMA_LOAD_IMAGE_REF}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: osdu-config
          env:
            - name: NAMESPACE
              value: "osdu"
            # The loader reads DATA_PARTITION; system-db is primary-only,
            # so it is aliased from PRIMARY_PARTITION.
            - name: DATA_PARTITION
              valueFrom:
                configMapKeyRef:
                  name: osdu-config
                  key: PRIMARY_PARTITION
          volumeMounts:
            - name: scripts
              mountPath: /home/osdu/deployments/scripts/azure/bootstrap.sh
              subPath: bootstrap.sh
            - name: scripts
              mountPath: /home/osdu/deployments/scripts/azure/Token.py
              subPath: Token.py
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
