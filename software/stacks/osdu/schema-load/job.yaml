# One-shot Job that loads the OSDU shared schemas into the primary
# partition, authenticating through workload-identity-sa. Two loader images
# run here. Upstream's community image runs bootstrap.sh from
# /home/osdu/deployments/scripts/azure, so the ConfigMap with the wrapper and
# Token.py is mounted as that whole directory rather than overriding
# `command`; nothing else in it is read at run time. The schema fork's paired
# image (osdu-spi ADR-042) carries its own entrypoint, which reads SCHEMA_URL
# and the workload identity variables; the directory mount only creates an
# empty path it never looks at. The mount and script.yaml stay while an
# environment can select community as schema's canonical source.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
  namespace: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: schema-load
spec:
  backoffLimit: 2
  # Counts from Job activation, before the Pod is scheduled: 1800s for node
  # provisioning, scheduling, and image pull, 2700s for the script's own
  # schema-service wait, and the rest for the throttled load of ~1,386
  # schemas. The Flux Kustomization timeout must exceed this.
  activeDeadlineSeconds: 9000
  # No ttlSecondsAfterFinished: a TTL would let Flux re-apply the deleted
  # Job on its next reconcile. Re-run with kubectl delete job schema-load -n osdu.
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: osdu-spi-stack
        app.kubernetes.io/component: schema-load
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      restartPolicy: Never
      nodeSelector:
        spi-pool: osdu
      tolerations:
        - key: workload
          operator: Equal
          value: "osdu"
          effect: NoSchedule
      volumes:
        - name: scripts
          configMap:
            name: schema-load-scripts
            defaultMode: 0755
      containers:
        - name: loader
          # From the osdu-image-lock ConfigMap, on the same SHA as
          # schema-service. No static default: upstream prunes old tags.
          # `spi reconcile` backfills a lock that predates this key.
          image: ${SCHEMA_LOAD_IMAGE_REF}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: osdu-config
          env:
            - name: NAMESPACE
              value: "osdu"
            # Read by the fork-built loader's entrypoint; the community wrapper
            # hardcodes the same service.
            - name: SCHEMA_URL
              value: "http://schema.osdu.svc.cluster.local/api/schema-service/v1"
            # The loader reads DATA_PARTITION; system-db is primary-only,
            # so it is aliased from PRIMARY_PARTITION.
            - name: DATA_PARTITION
              valueFrom:
                configMapKeyRef:
                  name: osdu-config
                  key: PRIMARY_PARTITION
          volumeMounts:
            - name: scripts
              mountPath: /home/osdu/deployments/scripts/azure
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
