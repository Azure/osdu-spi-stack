# One-shot Job that loads the OSDU shared schemas into the primary
# partition, authenticating through workload-identity-sa. The loader image's
# own entrypoint (build/load-entrypoint.sh in the schema repository) reads
# SCHEMA_URL, WAIT_SECONDS, and the workload identity variables.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
  namespace: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: schema-load
spec:
  backoffLimit: 2
  # Counts from Job activation, before the Pod is scheduled: 1800s for node
  # provisioning, scheduling, and image pull, WAIT_SECONDS for the loader's
  # schema-service wait, and the rest for the throttled load of ~1,386
  # schemas. The Flux Kustomization timeout must exceed this.
  activeDeadlineSeconds: 9000
  # No ttlSecondsAfterFinished: a TTL would let Flux re-apply the deleted
  # Job on its next reconcile. Re-run with kubectl delete job schema-load -n osdu.
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: osdu-spi-stack
        app.kubernetes.io/component: schema-load
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      restartPolicy: Never
      # AKS Deployment Safeguards compliance. The loader only needs to read
      # its image and write /tmp/load.log.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        spi-pool: osdu
      tolerations:
        - key: workload
          operator: Equal
          value: "osdu"
          effect: NoSchedule
      containers:
        - name: loader
          # From the osdu-image-lock ConfigMap, on the same SHA as
          # schema-service. No static default: GHCR retention prunes old versions.
          image: ${SCHEMA_LOAD_IMAGE_REF}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: osdu-config
          env:
            - name: NAMESPACE
              value: "osdu"
            - name: SCHEMA_URL
              value: "http://schema.osdu.svc.cluster.local/api/schema-service/v1"
            - name: WAIT_SECONDS
              value: "2700"
            # The loader reads DATA_PARTITION; system-db is primary-only,
            # so it is aliased from PRIMARY_PARTITION.
            - name: DATA_PARTITION
              valueFrom:
                configMapKeyRef:
                  name: osdu-config
                  key: PRIMARY_PARTITION
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /proc/1/status"]
            periodSeconds: 30
            failureThreshold: 3
