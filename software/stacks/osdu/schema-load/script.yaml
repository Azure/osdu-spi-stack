# Wrapper bootstrap.sh and MSAL token helper mounted over the community
# schema-load image's own entrypoint. The wrapper waits for the schema
# service, acquires a Workload Identity token, runs the image-bundled
# DeploySharedSchemas.py, and treats "already exists" failures as success
# so re-runs pass. Token.py requests the management.azure.com scope; the
# schema service validates by appid, not audience.
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-load-scripts
  namespace: osdu
  annotations:
    # Without this, Flux postBuild substitution blanks out every ${VAR} below.
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: schema-load
data:
  bootstrap.sh: |
    #!/usr/bin/env sh
    set -u

    AZURE_SCHEMA_URL="http://schema.osdu.svc.cluster.local/api/schema-service/v1/schemas/system"
    SCHEMA_INFO_URL="http://schema.osdu.svc.cluster.local/api/schema-service/v1/info"
    export AZURE_SCHEMA_URL

    # A Ready HelmRelease does not guarantee the schema endpoint is serving,
    # so wait for /info to return 200. The deadline is wall-clock, not an
    # attempt count, because each attempt costs the 5s urlopen timeout on
    # top of the 2s sleep. The timer starts inside the running Pod; job.yaml
    # budgets pod startup separately. urllib rather than curl: the image's
    # curl fails on a libcurl/libssh2 ABI mismatch.
    echo "Waiting for schema service at ${SCHEMA_INFO_URL}..."
    # Leaves 4500s of the Job's 9000s deadline for token acquisition and load.
    WAIT_DEADLINE_SECONDS=2700
    start_ts=$(date +%s)
    until python - <<PY 2>/dev/null
    import sys, urllib.request
    try:
        code = urllib.request.urlopen("${SCHEMA_INFO_URL}", timeout=5).getcode()
    except Exception:
        code = 0
    sys.exit(0 if code == 200 else 1)
    PY
    do
      elapsed=$(( $(date +%s) - start_ts ))
      if [ "${elapsed}" -ge "${WAIT_DEADLINE_SECONDS}" ]; then
        echo "ERROR: schema service did not return 200 after ${elapsed}s"
        exit 1
      fi
      sleep 2
    done
    echo "Schema service ready (after $(( $(date +%s) - start_ts ))s)."

    echo "Acquiring bearer token via Workload Identity..."
    BEARER_TOKEN=$(python "${AZURE_DEPLOYMENTS_SUBDIR}/Token.py")
    if [ -z "${BEARER_TOKEN}" ]; then
      echo "ERROR: failed to acquire bearer token"
      exit 1
    fi
    export BEARER_TOKEN

    # Redirect then cat rather than a pipe, so $? is the Python exit status
    # and not tee's.
    echo "Loading schemas for partition '${DATA_PARTITION}'..."
    python "${AZURE_DEPLOYMENTS_SCRIPTS_SUBDIR}/DeploySharedSchemas.py" -u "${AZURE_SCHEMA_URL}" >/tmp/load.log 2>&1
    ret=$?
    cat /tmp/load.log

    if [ "${ret}" -ne 0 ]; then
      if grep -qE 'already exists|already PUBLISHED|SCHEMA_EXISTS' /tmp/load.log; then
        echo "Non-zero exit but only 'already exists' failures detected; treating as success."
        exit 0
      fi
      echo "Schema load failed with exit code ${ret}."
      exit "${ret}"
    fi
    echo "Schema load completed successfully."
  Token.py: |
    """MSAL federated-token exchange for Workload Identity.

    Reads the AZURE_* variables the Workload Identity webhook injects and
    prints a bearer token. The schema service validates by appid, not
    audience, so the always-resolvable management.azure.com scope is used.
    """
    import os
    import msal


    def main():
        tenant_id = os.getenv("AZURE_TENANT_ID")
        client_id = os.getenv("AZURE_CLIENT_ID")
        token_path = os.getenv(
            "AZURE_FEDERATED_TOKEN_FILE",
            "/var/run/secrets/azure/tokens/azure-identity-token",
        )

        if not tenant_id or not client_id:
            raise SystemExit(
                "AZURE_TENANT_ID and AZURE_CLIENT_ID are required"
            )

        with open(token_path, "r") as fh:
            federated_token = fh.read().strip()

        authority = f"https://login.microsoftonline.com/{tenant_id}"
        app = msal.ConfidentialClientApplication(
            client_id=client_id,
            authority=authority,
            client_credential={
                "client_assertion_type": (
                    "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
                ),
                "client_assertion": federated_token,
            },
        )

        result = app.acquire_token_for_client(
            scopes=["https://management.azure.com/.default"]
        )
        if "access_token" not in result:
            raise SystemExit(
                f"Token acquisition failed: {result.get('error_description', result)}"
            )
        print(f"Bearer {result['access_token']}")


    if __name__ == "__main__":
        main()
