# trust-manager Bundles that mirror the Redis and Elasticsearch CAs from
# platform into osdu, where the osdu-spi-service import-ca-certs init
# container builds the Java truststore. A rotated source CA re-syncs.
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: redis-ca-cert
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: ca-bundle
spec:
  sources:
    - secret:
        name: redis-tls-secret
        key: ca.crt
  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: osdu
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: elastic-ca-cert
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    app.kubernetes.io/component: ca-bundle
spec:
  sources:
    - secret:
        name: elasticsearch-es-http-certs-public
        key: ca.crt
  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: osdu
