# Disables Istio mTLS toward Redis. Lettuce already speaks TLS end-to-end,
# and it cannot unwrap the TLS-in-TLS stream automatic mTLS would add.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: redis-disable-mtls
  namespace: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  host: platform-redis-master.platform.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
