apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-etp
  namespace: osdu
spec:
  parentRefs:
    - name: spi-gateway
      namespace: platform
  hostnames:
    - "${INGRESS_FQDN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/reservoir-ddms-etp/v2/ }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: open-etp
          port: 80
    - matches:
        - path: { type: PathPrefix, value: /api/reservoir-ddms/v2/ }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: open-etp-client
          port: 80
