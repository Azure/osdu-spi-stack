apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seismic
  namespace: osdu
spec:
  parentRefs:
    - name: spi-gateway
      namespace: platform
  hostnames:
    - "${INGRESS_HOST_OSDU}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /seistore-svc/api/v3 }
      backendRefs:
        - name: seismic
          port: 80
