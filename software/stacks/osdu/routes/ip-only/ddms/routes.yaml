apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rafs
  namespace: osdu
spec:
  parentRefs:
    - name: spi-gateway
      namespace: platform
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/rafs-ddms/ }
      backendRefs:
        - name: rafs
          port: 80
