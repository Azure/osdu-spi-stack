apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osdu-spi-init
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-init
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  # The CLI writes the partition list into spi-init-values; --partition
  # changes need no edit here.
  valuesFrom:
    - kind: ConfigMap
      name: spi-init-values
      valuesKey: values.yaml
  # Core Jobs only; legal seeding runs in the non-gating osdu-spi-legal release.
  values:
    legalEnabled: false
