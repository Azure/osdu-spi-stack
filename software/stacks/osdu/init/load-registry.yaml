# The named loads this stack version offers. `spi load` and `spi info` read
# the copy Flux delivers as the ConfigMap spi-load-registry.
apiVersion: spi.osdu.dev/v1
loads:
  - name: schemas
    default: true
    # Flux owns the Job: schema-load, behind spi-osdu-schema-load (ADR-013).
    runner: flux
    source:
      type: paired-image
      service: schema
    scope: primary-partition

  - name: reference-data
    default: true
    runner: job
    requires: [schemas]
    source:
      type: gitlab-archive
      project: osdu/data/data-definitions
      ref: v0.30.0
      # The commit v0.30.0 points to. The Job fetches by commit; ref is for people.
      commit: 99f8fc88d8ad838b5738ac5ad92ac643538b5766
      path: ReferenceValues/Manifests/reference-data
    loader: records
    scope: each-partition

  - name: rafs-schemas
    default: true
    runner: job
    requires: [schemas]
    source:
      type: gitlab-archive
      project: osdu/platform/domain-data-mgmt-services/rock-and-fluid-sample/rafs-ddms-services
      ref: ed9dda249e5b
      commit: ed9dda249e5bc5f04736a1f5acd651468b233a8f
      path: deployments/rafsddms_schemas_mvp.postman_collection.json
    loader: schemas
    scope: each-partition

  - name: rafs-reference-data
    default: true
    runner: job
    requires: [rafs-schemas]
    source:
      type: gitlab-archive
      project: osdu/platform/domain-data-mgmt-services/rock-and-fluid-sample/rafs-ddms-services
      ref: ed9dda249e5b
      commit: ed9dda249e5bc5f04736a1f5acd651468b233a8f
      path: deployments/reference-data
    loader: records
    scope: each-partition
