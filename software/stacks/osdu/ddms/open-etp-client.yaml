apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-etp-client
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: open-etp
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    serviceAccountName: default
    automountServiceAccountToken: false
    workloadIdentity: false
    replicaCount: 1
    deploymentStrategy:
      type: Recreate
    terminationGracePeriodSeconds: 45
    image:
      repository: ${OPEN_ETP_CLIENT_IMAGE_REPOSITORY}
      tag: "${OPEN_ETP_CLIENT_IMAGE_TAG}"
      digest: "${OPEN_ETP_CLIENT_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${OPEN_ETP_CLIENT_DO_NOT_DISRUPT:=false}"
    containerPort: 8003
    service:
      port: 80
    probes:
      liveness:
        path: /health/liveness
        port: 8003
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      readiness:
        path: /health/readiness
        port: 8003
        initialDelaySeconds: 20
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 3
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    env:
      - name: RDMS_ETP_PROTOCOL
        value: ws
      - name: RDMS_ETP_HOST
        value: open-etp
      - name: RDMS_ETP_PORT
        value: "80"
      - name: RDMS_ETP_PATH
        value: ""
      - name: RDMS_REST_ROOT_PATH
        value: /
      - name: RDMS_REST_PORT
        value: "8003"
      - name: RDMS_OSDU_URL
        value: http://schema
      - name: RDMS_DATA_PARTITION_MODE
        value: multiple
      - name: RDMS_ENABLE_LOCAL_TOKEN_ENDPOINT
        value: "false"
