apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crs-catalog
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    image:
      repository: ${CRS_CATALOG_IMAGE_REPOSITORY}
      tag: "${CRS_CATALOG_IMAGE_TAG}"
      digest: "${CRS_CATALOG_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${CRS_CATALOG_DO_NOT_DISRUPT:=false}"
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    probes:
      liveness:
        path: /actuator/health
        port: 8081
        initialDelaySeconds: 250
      readiness:
        path: /actuator/health
        port: 8081
        initialDelaySeconds: 10
    env:
      - name: SPRING_APPLICATION_NAME
        value: crs-catalog
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/crs/catalog/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENT_URL
        value: http://entitlements/api/entitlements/v2
    # Downloads the catalog from the same immutable source revision when the
    # pod starts and verifies it before making it visible to the service.
    initContainers:
      - name: download-catalog
        image: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        command:
          - sh
          - -c
          - |
            set -eu
            file=/data/crs_catalog_v2.json.download
            wget -O "$file" https://community.opengroup.org/osdu/platform/system/reference/crs-catalog-service/-/raw/1520fcfe1126ac5b28e6f4ccf9ec268b526ddedc/data/crs_catalog_v2.json
            echo "0166cf95dc237152ba688d59cd7f921f00812704a464987df48fbf1813fb6ab1  $file" | sha256sum -c -
            mv "$file" /data/crs_catalog_v2.json
        volumeMounts:
          - name: crs-data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: crs-data
        mountPath: /mnt/crs_catalogs
        readOnly: true
    volumes:
      - name: crs-data
        emptyDir: {}
