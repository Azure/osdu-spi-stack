apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unit
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: ${UNIT_REPLICAS:=1}
    resources:
      requests:
        cpu: "${UNIT_CPU_REQUEST:=300m}"
        memory: "${UNIT_MEMORY_REQUEST:=896Mi}"
      limits:
        cpu: "${UNIT_CPU_LIMIT:=1}"
        memory: "${UNIT_MEMORY_LIMIT:=1536Mi}"
    image:
      repository: ${UNIT_IMAGE_REPOSITORY}
      tag: "${UNIT_IMAGE_TAG}"
      digest: "${UNIT_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${UNIT_DO_NOT_DISRUPT:=false}"
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    probes:
      liveness:
        path: /api/unit/actuator/health
        port: 8080
        initialDelaySeconds: 250
      readiness:
        path: /api/unit/actuator/health
        port: 8080
        initialDelaySeconds: 10
    env:
      - name: SPRING_APPLICATION_NAME
        value: unit
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/unit/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENT_URL
        value: http://entitlements/api/entitlements/v2
    # Downloads the catalog from the same immutable source revision when the
    # pod starts and verifies it before making it visible to the service.
    initContainers:
      - name: download-catalog
        image: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        command:
          - sh
          - -c
          - |
            set -eu
            file=/data/unit_catalog_v2.json.download
            wget -O "$file" https://community.opengroup.org/osdu/platform/system/reference/unit-service/-/raw/9b9364977352ec22f358ec592934c3a60e679b4e/data/unit_catalog_v2.json
            echo "f703457c42de2f61b17adb3b1626f9d8c3416763aef8d7c9df221219cf91938d  $file" | sha256sum -c -
            mv "$file" /data/unit_catalog_v2.json
        volumeMounts:
          - name: unit-data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: unit-data
        mountPath: /mnt/unit_catalogs
        readOnly: true
    volumes:
      - name: unit-data
        emptyDir: {}
