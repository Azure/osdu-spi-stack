apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crs-conversion
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: ${CRS_CONVERSION_REPLICAS:=1}
    resources:
      requests:
        cpu: "${CRS_CONVERSION_CPU_REQUEST:=300m}"
        memory: "${CRS_CONVERSION_MEMORY_REQUEST:=896Mi}"
      limits:
        cpu: "${CRS_CONVERSION_CPU_LIMIT:=1}"
        memory: "${CRS_CONVERSION_MEMORY_LIMIT:=1536Mi}"
    image:
      repository: ${CRS_CONVERSION_IMAGE_REPOSITORY}
      tag: "${CRS_CONVERSION_IMAGE_TAG}"
      digest: "${CRS_CONVERSION_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${CRS_CONVERSION_DO_NOT_DISRUPT:=false}"
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    probes:
      liveness:
        path: /api/crs/converter/actuator/health
        port: 8080
        initialDelaySeconds: 250
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        path: /api/crs/converter/actuator/health
        port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    env:
      - name: SPRING_APPLICATION_NAME
        value: crs-conversion
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/crs/converter/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: SIS_DATA
        value: /app/sis-data
      - name: SERVICE_DOMAIN_NAME
        value: dataservices.energy
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENT_URL
        value: http://entitlements/api/entitlements/v2
      - name: STORAGE_URL
        value: http://storage/api/storage/v2
    # Same JDK base as the app image, so its layers are already on the node.
    initContainers:
      - name: download-sis-data
        image: mcr.microsoft.com/openjdk/jdk:25-azurelinux@sha256:61002c0b9ccdd84295342d305e4cf6f956d205cf1cd2eabc2f9e376aff1e70f6
        command:
          - sh
          - -c
          - |
            set -eu
            archive=/data/sis-data.tar
            rm -rf "$archive" "$archive.gz" /data/sis-data.download
            curl -fsSL --retry 3 -o "$archive.gz" "https://community.opengroup.org/osdu/platform/system/reference/crs-conversion-service/-/archive/7d90a9b36b521119057494d7f38b123271608f42/crs-conversion-service-7d90a9b36b521119057494d7f38b123271608f42.tar.gz?path=apachesis_setup/SIS_DATA"
            gzip -d "$archive.gz"
            # Hash the tar, not the .gz: GitLab regenerates archives and does not promise stable gzip bytes.
            echo "bf18888423797b80798804fe092e23c0d3dbd1379ca5ea92a80d8d6057fd8dcd  $archive" | sha256sum -c -
            mkdir /data/sis-data.download
            bsdtar -xf "$archive" -C /data/sis-data.download --strip-components 3
            rm "$archive"
            rm -rf /data/sis-data
            mv /data/sis-data.download /data/sis-data
        volumeMounts:
          - name: sis-data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: sis-data
        mountPath: /app/sis-data
        subPath: sis-data
    volumes:
      - name: sis-data
        emptyDir: {}
