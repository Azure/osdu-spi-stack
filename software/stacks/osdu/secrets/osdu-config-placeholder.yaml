# The osdu-config ConfigMap and workload-identity-sa ServiceAccount are
# created by the CLI bootstrap before GitOps starts; this file documents the
# dependency.
#
# Required ConfigMap keys:
#   DOMAIN, PRIMARY_PARTITION, AZURE_TENANT_ID, AAD_CLIENT_ID,
#   KEYVAULT_URI, KEYVAULT_URL, KEYVAULT_NAME,
#   PRIMARY_COSMOSDB_ENDPOINT, COSMOSDB_DATABASE,
#   PRIMARY_STORAGE_ACCOUNT_NAME, PRIMARY_SERVICEBUS_NAMESPACE,
#   REDIS_HOSTNAME, REDIS_PORT, SERVER_PORT,
#   APPINSIGHTS_KEY, ELASTICSEARCH_HOST
#
# PRIMARY_* keys carry the primary partition's data plane endpoints for the
# schema-load Job (system-db is primary-only) and for operator visibility;
# services route per request through partition-service.
