apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: spi-osdu-dag-files-source
    files:
      - catalog.yaml
      - requirements.txt
      - load.py
      - echo_dag.py=smoke/echo_dag.py
      - airflow_monitoring.py=smoke/airflow_monitoring.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    config.kubernetes.io/local-config: "true"
