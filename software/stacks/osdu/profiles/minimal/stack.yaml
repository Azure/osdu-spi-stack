# SPI Stack - Minimal Profile
# Middleware only: identical to the core profile through Layer 4b, then stops
# (no OSDU services, bootstrap Jobs, schema load, or reference services).
# Pairs with any --ingress-mode; the CLI selects the matching
# software/stacks/osdu/ingress/<mode>-minimal tree.

---
# Layer 0a: Namespaces
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-namespaces
  namespace: osdu-flux
  labels:
    spi-stack.layer: "0"
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/namespaces
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-cluster-config
        optional: false
  prune: false
  wait: true
  timeout: 5m

---
# Layer 0b: Karpenter NodePools
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-nodepools
  namespace: osdu-flux
  labels:
    spi-stack.layer: "0"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/nodepools
  prune: true
  wait: true
  timeout: 5m

---
# Layer 1a: cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cert-manager
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/cert-manager
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1a2: trust-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-trust-manager
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/trust-manager
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1b: ECK operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-eck-operator
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/operators/eck
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1c: CNPG operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cnpg-operator
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/operators/cnpg
  prune: true
  wait: true
  timeout: 10m

---
# Gateway ownership handoff: reconciles an empty inventory with pruning
# disabled, so a later rollout can remove it without deleting the Gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/inventory-handoff
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 5m

---
# Layer 1e: Shared Helm sources. The bitnami HelmRepository serves Redis and,
# in the dns ingress modes, ExternalDNS; a single owner keeps either
# consumer's inventory from pruning it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-helm-sources
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/helm-sources
  prune: true
  wait: true
  timeout: 5m

---
# Layer 2a: Elasticsearch
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-elasticsearch
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-eck-operator
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/elasticsearch
  prune: true
  wait: true
  timeout: 15m

---
# Layer 2b: Redis
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-redis
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
    - name: spi-nodepools
    - name: spi-helm-sources
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/redis
  # Source ownership handoff: pruning stays off until this has reconciled
  # once without the bitnami HelmRepository in its inventory.
  prune: false
  wait: true
  timeout: 10m

---
# Layer 2c: PostgreSQL (Airflow metadata)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-postgresql
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cnpg-operator
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/postgres
  prune: true
  wait: true
  timeout: 10m

---
# Layer 3: Airflow
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-airflow
  namespace: osdu-flux
  labels:
    spi-stack.layer: "3"
spec:
  interval: 10m
  dependsOn:
    - name: spi-postgresql
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/airflow
  prune: true
  wait: true
  timeout: 15m

---
# Layer 4: OSDU configuration placeholder
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-config
  namespace: osdu-flux
  labels:
    spi-stack.layer: "4"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/secrets
  prune: false
  wait: true
  timeout: 5m

---
# Layer 4b: Bootstrap (trust-manager Bundles + Redis Istio DestinationRule).
# Waits on middleware so the source CA secrets exist and on trust-manager so
# the Bundle CRD is registered.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-bootstrap
  namespace: osdu-flux
  labels:
    spi-stack.layer: "4"
spec:
  interval: 10m
  dependsOn:
    - name: spi-trust-manager
    - name: spi-elasticsearch
    - name: spi-redis
    - name: spi-osdu-config
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/bootstrap
  prune: true
  wait: true
  timeout: 10m
