# SPI Stack - Core Profile
# Middleware, the OSDU services, their bootstrap Jobs, schema load, and the
# reference services, as layered Flux Kustomizations with explicit dependency
# ordering. The Gateway is owned by the ingress tree, not this profile.

---
# Layer 0a: Namespaces
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-namespaces
  namespace: osdu-flux
  labels:
    spi-stack.layer: "0"
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/namespaces
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-cluster-config
        optional: false
  prune: false
  wait: true
  timeout: 5m

---
# Layer 0b: Karpenter NodePools
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-nodepools
  namespace: osdu-flux
  labels:
    spi-stack.layer: "0"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/nodepools
  prune: true
  wait: true
  timeout: 5m

---
# Layer 1a: cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cert-manager
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/cert-manager
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1a2: trust-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-trust-manager
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/trust-manager
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1b: ECK operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-eck-operator
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/operators/eck
  prune: true
  wait: true
  timeout: 10m

---
# Layer 1c: CNPG operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-cnpg-operator
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/operators/cnpg
  prune: true
  wait: true
  timeout: 10m

---
# Gateway ownership handoff: reconciles an empty inventory with pruning
# disabled, so a later rollout can remove it without deleting the Gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-gateway
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/inventory-handoff
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 5m

---
# Layer 1e: Shared Helm sources. The bitnami HelmRepository serves Redis and,
# in the dns ingress modes, ExternalDNS; a single owner keeps either
# consumer's inventory from pruning it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-helm-sources
  namespace: osdu-flux
  labels:
    spi-stack.layer: "1"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/helm-sources
  prune: true
  wait: true
  timeout: 5m

---
# Layer 2a: Elasticsearch
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-elasticsearch
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-eck-operator
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/elasticsearch
  prune: true
  wait: true
  timeout: 15m

---
# Layer 2b: Redis
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-redis
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cert-manager
    - name: spi-nodepools
    - name: spi-helm-sources
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/redis
  # Source ownership handoff: pruning stays off until this has reconciled
  # once without the bitnami HelmRepository in its inventory.
  prune: false
  wait: true
  timeout: 10m

---
# Layer 2c: PostgreSQL (Airflow metadata)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-postgresql
  namespace: osdu-flux
  labels:
    spi-stack.layer: "2"
spec:
  interval: 10m
  dependsOn:
    - name: spi-cnpg-operator
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/postgres
  prune: true
  wait: true
  timeout: 10m

---
# Layer 3: Airflow
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-airflow
  namespace: osdu-flux
  labels:
    spi-stack.layer: "3"
spec:
  interval: 10m
  dependsOn:
    - name: spi-postgresql
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/airflow
  prune: true
  wait: true
  timeout: 15m

---
# Layer 4: OSDU configuration placeholder
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-config
  namespace: osdu-flux
  labels:
    spi-stack.layer: "4"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/secrets
  prune: false
  wait: true
  timeout: 5m

---
# Layer 4b: Bootstrap (trust-manager Bundles + Redis Istio DestinationRule).
# Waits on middleware so the source CA secrets exist and on trust-manager so
# the Bundle CRD is registered.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-bootstrap
  namespace: osdu-flux
  labels:
    spi-stack.layer: "4"
spec:
  interval: 10m
  dependsOn:
    - name: spi-trust-manager
    - name: spi-elasticsearch
    - name: spi-redis
    - name: spi-osdu-config
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/bootstrap
  prune: true
  wait: true
  timeout: 10m

---
# Layer 5: Core OSDU services
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-services
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-bootstrap
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  prune: true
  wait: true
  timeout: 30m

---
# Layer 5a: OSDU partition + entitlements bootstrap (per-partition Jobs).
# Schema-load depends on both: without the root groups entitlements seeds,
# its call to /schemas/system returns 401.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-init
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/init
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: osdu-spi-init
      namespace: osdu-flux

---
# Layer 5c: legal seeding (per-partition Jobs, non-gating). Its own release
# so a legal failure cannot block schema-load; the spi-stack.gating: "false"
# label keeps it out of the `spi status` Ready verdict. Nothing depends on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-legal
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
    spi-stack.gating: "false"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/legal
  prune: true
  wait: true
  # Outlasts the HelmRelease's 65m install timeout.
  timeout: 70m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: osdu-spi-legal
      namespace: osdu-flux

---
# Layer 5b: OSDU schema loader (one-shot Job). The healthCheck on the Job's
# Complete condition is what lets spi-osdu-reference depend on a loaded
# cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-schema-load
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/schema-load
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  # A changed image updates the Job Pod template, an immutable field.
  force: true
  prune: true
  wait: true
  # The Job's 9000s activeDeadlineSeconds plus reconcile headroom.
  timeout: 155m
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: schema-load
      namespace: osdu

---
# Layer 6: Reference services
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-reference
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-osdu-schema-load
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/services-reference
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  prune: true
  wait: true
  timeout: 30m
