# SPI Stack - Core Profile
# The minimal profile's middleware layers, then fork RBAC, the OSDU services,
# their bootstrap Jobs, schema load, and the reference services. Only the
# layers core adds live here; ../minimal carries the rest.

---
# Layer 0c: Fork RBAC (deploy identity Roles, ADR-032)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-fork-rbac
  namespace: osdu-flux
  labels:
    spi-stack.layer: "0"
spec:
  interval: 10m
  dependsOn:
    - name: spi-namespaces
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/components/fork-rbac
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-cluster-config
        optional: false
  prune: true
  wait: true
  timeout: 5m
---
# Layer 5: Core OSDU services
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-services
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-bootstrap
    - name: spi-nodepools
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  prune: true
  wait: true
  timeout: 30m

---
# Layer 5a: OSDU partition + entitlements bootstrap (per-partition Jobs).
# Schema-load depends on both: without the root groups entitlements seeds,
# its call to /schemas/system returns 401.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-init
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/init
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: osdu-spi-init
      namespace: osdu-flux

---
# Layer 5c: legal seeding (per-partition Jobs, non-gating). Its own release
# so a legal failure cannot block schema-load; the spi-stack.gating: "false"
# label keeps it out of the `spi status` Ready verdict. Nothing depends on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-legal
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
    spi-stack.gating: "false"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/legal
  prune: true
  wait: true
  # Outlasts the HelmRelease's 65m install timeout.
  timeout: 70m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: osdu-spi-legal
      namespace: osdu-flux

---
# Layer 5d: deploy identity membership, non-gating like legal so a failed
# seed cannot block schema-load; spi status reports it as bootstrap_failed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-members
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
    spi-stack.gating: "false"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/members
  prune: true
  wait: true
  # Outlasts the HelmRelease's 35m install timeout.
  timeout: 40m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: osdu-spi-members
      namespace: osdu-flux

---
# Layer 5b: OSDU schema loader (one-shot Job). The healthCheck on the Job's
# Complete condition is what lets spi-osdu-reference depend on a loaded
# cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-schema-load
  namespace: osdu-flux
  labels:
    spi-stack.layer: "5"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/schema-load
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  # A changed image updates the Job Pod template, an immutable field.
  force: true
  prune: true
  wait: true
  # The Job's 9000s activeDeadlineSeconds plus reconcile headroom.
  timeout: 155m
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: schema-load
      namespace: osdu

---
# Layer 6: Domain data management services
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-ddms
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-init
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/ddms
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  prune: true
  wait: true
  timeout: 30m

---
# Layer 6: Reference services
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-osdu-reference
  namespace: osdu-flux
  labels:
    spi-stack.layer: "6"
spec:
  interval: 10m
  dependsOn:
    - name: spi-osdu-services
    - name: spi-osdu-schema-load
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/services-reference
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: osdu-image-lock
  prune: true
  wait: true
  timeout: 30m
