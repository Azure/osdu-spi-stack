# SPI Stack - Bare profile
#
# No workloads. GitOps remains activated and healthy, and Flux converges only
# the stack version stamp. The CLI bootstrap seeds namespaces, secrets, the
# osdu-config ConfigMap, and the Workload Identity ServiceAccount.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../components/stack-version
