apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osdu-spi-members
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    # Outlasts the Job's activeDeadlineSeconds so helm observes its outcome.
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      # A rollback would delete the failed Job spi status reports on.
      remediateLastFailure: false
  chart:
    spec:
      chart: ./software/charts/osdu-spi-init
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  # Same chart and values as osdu-spi-init with only the members component
  # rendered; helm-controller waits for every Job in a release, so the seed
  # gets its own non-gating release. Inline values override valuesFrom.
  valuesFrom:
    - kind: ConfigMap
      name: spi-init-values
      valuesKey: values.yaml
  values:
    coreEnabled: false
    legalEnabled: false
    membersEnabled: true
