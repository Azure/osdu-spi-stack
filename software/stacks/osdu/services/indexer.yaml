apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: indexer
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: storage
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    image:
      repository: ${INDEXER_IMAGE_REPOSITORY}
      tag: "${INDEXER_IMAGE_TAG}"
      digest: "${INDEXER_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${INDEXER_DO_NOT_DISRUPT:=false}"
    elasticTls: true
    redisTls: true
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    istioProxyPin:
      enabled: true
    initContainers:
      - name: install-java-runtime
        # Match the glibc Azure Linux runtime in Azure/osdu-spi's service Dockerfile.
        image: mcr.microsoft.com/openjdk/jdk:25-azurelinux@sha256:9c3b6e495e05d71f9db65e54d2946c92773baf71b550e26f8fd2ac25d2235831
        command:
          - sh
          - -c
          - cp -R "$JAVA_HOME/." /java-runtime/
        volumeMounts:
          - name: java-runtime
            mountPath: /java-runtime
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: java-runtime
        mountPath: /java-runtime
        readOnly: true
    volumes:
      - name: java-runtime
        emptyDir: {}
    env:
      # The upstream image currently carries Java 25 bytecode over a Java 17 base runtime.
      - name: JAVA_HOME
        value: /java-runtime
      - name: PATH
        value: /java-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: SPRING_APPLICATION_NAME
        value: indexer
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/indexer/v2/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: SECURITY_HTTPS_CERTIFICATE_TRUST
        value: "true"
      - name: COSMOSDB_DATABASE
        value: osdu-db
      - name: SERVICEBUS_TOPIC_NAME
        value: indexing-progress
      - name: REINDEX_TOPIC_NAME
        value: recordstopic
      - name: REDIS_DATABASE
        value: "4"
      - name: REDIS_TTL_SECONDS
        value: "3600"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENTS_SERVICE_ENDPOINT
        value: http://entitlements/api/entitlements/v2
      - name: ENTITLEMENTS_SERVICE_API_KEY
        value: OBSOLETE
      - name: SCHEMA_SERVICE_URL
        value: http://schema/api/schema-service/v1
      - name: STORAGE_SERVICE_URL
        value: http://storage/api/storage/v2
      - name: STORAGE_SCHEMA_HOST
        value: http://storage/api/storage/v2/schemas
      - name: STORAGE_QUERY_RECORD_FOR_CONVERSION_HOST
        value: http://storage/api/storage/v2/query/records:batch
      - name: STORAGE_QUERY_RECORD_HOST
        value: http://storage/api/storage/v2/query/records
      - name: SEARCH_SERVICE_URL
        value: http://search/api/search/v2
