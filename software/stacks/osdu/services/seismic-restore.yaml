apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seismic-restore
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: seismic
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: ${SEISMIC_RESTORE_REPLICA_COUNT:=0}
    image:
      repository: ${SEISMIC_RESTORE_IMAGE_REPOSITORY}
      tag: "${SEISMIC_RESTORE_IMAGE_TAG}"
      digest: "${SEISMIC_RESTORE_IMAGE_DIGEST}"
    runAsUser: 1654
    karpenter:
      doNotDisrupt: "${SEISMIC_RESTORE_DO_NOT_DISRUPT:=false}"
    containerPort: 6000
    service:
      port: 6000
    probes:
      liveness:
        path: /healthz
        port: 6000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        path: /healthz
        port: 6000
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    env:
      - name: HOST_PORT
        value: "6000"
      - name: SDMS_KEYVAULT_URL
        valueFrom:
          configMapKeyRef:
            name: osdu-config
            key: KEYVAULT_URL
      - name: DES_SERVICE_HOST
        value: http://partition
      - name: SDMS_REDIS_QUEUE_PORT
        value: "6379"
      - name: SDMS_REDIS_LOCKS_PORT
        value: "6379"
      - name: AZURE_MSI_ISENABLED
        value: "false"
      - name: SDMS_RESTORE_QUEUE
        value: sdms-queue-restore
      - name: AZURE_TOKEN_CREDENTIALS
        value: prod
      - name: SSL_CERT_FILE
        value: /redis-ca/ca.crt
    volumeMounts:
      - name: redis-ca
        mountPath: /redis-ca
        readOnly: true
    volumes:
      - name: redis-ca
        secret:
          secretName: redis-ca-cert
