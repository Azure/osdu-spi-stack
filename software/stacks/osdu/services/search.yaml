apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: search
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: storage
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: ${SEARCH_REPLICAS:=2}
    resources:
      requests:
        cpu: "${SEARCH_CPU_REQUEST:=300m}"
        memory: "${SEARCH_MEMORY_REQUEST:=896Mi}"
      limits:
        cpu: "${SEARCH_CPU_LIMIT:=1}"
        memory: "${SEARCH_MEMORY_LIMIT:=1536Mi}"
    podDisruptionBudget:
      enabled: true
    image:
      repository: ${SEARCH_IMAGE_REPOSITORY}
      tag: "${SEARCH_IMAGE_TAG}"
      digest: "${SEARCH_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${SEARCH_DO_NOT_DISRUPT:=false}"
    # Each replica caches the tenant set; a new partition list rolls the pods.
    partitionsHash: "${DATA_PARTITIONS_HASH:=}"
    elasticTls: true
    redisTls: true
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    env:
      - name: SPRING_APPLICATION_NAME
        value: search
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/search/v2/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: COSMOSDB_DATABASE
        value: osdu-db
      - name: REDIS_DATABASE
        value: "5"
      - name: ENVIRONMENT
        value: evt
      - name: ELASTIC_CACHE_EXPIRATION
        value: "1"
      - name: MAX_CACHE_VALUE_SIZE
        value: "60"
      - name: POLICY_SERVICE_ENABLED
        value: "false"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENTS_SERVICE_ENDPOINT
        value: http://entitlements/api/entitlements/v2
      - name: ENTITLEMENTS_SERVICE_API_KEY
        value: OBSOLETE
      - name: POLICY_SERVICE_ENDPOINT
        value: http://policy/api/policy/v1
