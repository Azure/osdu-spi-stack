apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: workflow
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: storage
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: ${WORKFLOW_REPLICAS:=1}
    resources:
      requests:
        cpu: "${WORKFLOW_CPU_REQUEST:=300m}"
        memory: "${WORKFLOW_MEMORY_REQUEST:=896Mi}"
      limits:
        cpu: "${WORKFLOW_CPU_LIMIT:=1}"
        memory: "${WORKFLOW_MEMORY_LIMIT:=1536Mi}"
    image:
      repository: ${WORKFLOW_IMAGE_REPOSITORY}
      tag: "${WORKFLOW_IMAGE_TAG}"
      digest: "${WORKFLOW_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${WORKFLOW_DO_NOT_DISRUPT:=false}"
    redisTls: true
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    env:
      - name: SPRING_APPLICATION_NAME
        value: workflow
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/workflow/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: SPRING_CONFIG_NAME
        value: common,application
      - name: COSMOSDB_DATABASE
        value: osdu-db
      - name: COSMOSDB_SYSTEM_DATABASE
        value: osdu-system-db
      - name: AZURE_STORAGE_ENABLE_HTTPS
        value: "true"
      - name: AUTHORIZEAPI
        value: http://entitlements/api/entitlements/v2
      - name: AUTHORIZEAPIKEY
        value: OBSOLETE
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: OSDU_ENTITLEMENTS_URL
        value: http://entitlements/api/entitlements/v2
      - name: OSDU_ENTITLEMENTS_APPKEY
        value: OBSOLETE
      - name: OSDU_AIRFLOW_VERSION
        value: airflow3
      - name: OSDU_AIRFLOW_AIRFLOW3_URL
        value: http://airflow-api-server.platform.svc.cluster.local:8080/airflow
      # The hop to the Airflow API server is in-cluster HTTP.
      - name: FEATURE_FLAG_ALLOW_HTTP_AIRFLOW
        value: "true"
      # Seeded by the CLI; the Airflow create-user job reads the same password.
      - name: OSDU_AIRFLOW_AIRFLOW3_USERNAME
        valueFrom:
          secretKeyRef:
            name: workflow-airflow-credentials
            key: username
      - name: OSDU_AIRFLOW_AIRFLOW3_PASSWORD
        valueFrom:
          secretKeyRef:
            name: workflow-airflow-credentials
            key: password
      - name: DP_AIRFLOW_FOR_SYSTEM_DAG
        value: "false"
      - name: IGNORE_DAGCONTENT
        value: "true"
      - name: IGNORE_CUSTOMOPERATORCONTENT
        value: "true"
