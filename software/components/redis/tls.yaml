# Self-signed CA and certificate for Redis TLS; services import the CA into
# their Java truststore.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: redis-selfsigned-issuer
  namespace: platform
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-tls-cert
  namespace: platform
spec:
  # keytool rejects a cert with an empty Subject DN as "Input not an X.509
  # certificate".
  commonName: redis
  isCA: true
  secretName: redis-tls-secret
  issuerRef:
    name: redis-selfsigned-issuer
    kind: Issuer
  dnsNames:
    # Flux's default releaseName prefixes the namespace, so the chart's
    # Services are platform-redis-*.
    - platform-redis-master.platform.svc.cluster.local
    - platform-redis-master.platform.svc
    - platform-redis-master
    - platform-redis-replicas.platform.svc.cluster.local
    - platform-redis-replicas.platform.svc
    - platform-redis-replicas
    # Short-name aliases for scripts.
    - redis-master.platform.svc.cluster.local
    - redis-master.platform.svc
    - redis-master
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days
