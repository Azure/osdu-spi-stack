# Gateway API Gateway in platform. The managed Istio control plane deploys
# its workload and LoadBalancer Service (spi-gateway-istio) from this object.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spi-gateway
  namespace: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
