# Clusters deployed before the Gateway moved to platform still hold this
# object, and AKS admission denies Flux both the update and the delete.
# Ignoring it keeps it in the owner's inventory so prune never fails on it;
# a fresh cluster never creates it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spi-gateway
  namespace: aks-istio-ingress
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Ignore
spec:
  gatewayClassName: istio
