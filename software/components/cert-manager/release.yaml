apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: osdu-flux
spec:
  targetNamespace: foundation
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: "v1.18.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # AKS policy aks-managed-require-webhook-protected-namespace-exclusion denies any mutating
  # webhook without this condition; the expression must equal the policy's string exactly.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: MutatingWebhookConfiguration
              name: foundation-cert-manager-webhook
            patch: |-
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingWebhookConfiguration
              metadata:
                name: foundation-cert-manager-webhook
              webhooks:
                - name: webhook.cert-manager.io
                  matchConditions:
                    - name: aks-managed-exclude-system-namespaces
                      expression: '!(has(request.namespace) && request.namespace in ["kube-system", "aks-istio-system", "aks-static-egress-gateway", "azuresecuritylinuxagent", "aks-istio-egress", "aks-istio-ingress", "fleet-system", "acstor", "azappconfig-system", "azure-extensions-usage-system", "dataprotection-microsoft", "gatekeeper-system", "sc-system"])'
  values:
    crds:
      enabled: true
    # Gateway API support: the Let's Encrypt ClusterIssuers solve HTTP-01 via
    # gatewayHTTPRoute.
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
    global:
      podSecurityPolicy:
        enabled: false
      # kube-system is protected on AKS Automatic; Leases live in the
      # release namespace.
      leaderElection:
        namespace: foundation
    # AKS Deployment Safeguards compliance
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    webhook:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
    cainjector:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
    startupapicheck:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
