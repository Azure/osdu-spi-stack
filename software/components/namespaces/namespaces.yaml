# The CLI bootstrap creates these namespaces; declaring them here lets Flux
# correct drift. ISTIO_REVISION comes from the spi-cluster-config ConfigMap
# the CLI writes, and the substitution is not optional: a guessed revision
# would silently disable sidecar injection.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    istio.io/rev: ${ISTIO_REVISION}
