# Namespaces are created by the CLI bootstrap. Flux uses the same runtime Istio
# revision from spi-ingress-config so it cannot drift the osdu label afterward.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    # Substituted from the spi-ingress-config ConfigMap (ADR-034). The default
    # is defence in depth, not the intended value: Flux renders an UNDEFINED
    # variable as an empty string rather than failing, and an empty istio.io/rev
    # silently disables sidecar injection for every OSDU service. A cluster
    # created before this key was published would otherwise be relabelled to ""
    # on the first reconcile after upgrading.
    istio.io/rev: ${ISTIO_REVISION:=asm-1-30}
