# Namespaces are created by the CLI bootstrap (with Istio injection labels);
# this manifest keeps them declared in Git so Flux corrects drift.
# ISTIO_REVISION is substituted from the osdu-flux/spi-cluster-config
# ConfigMap, which the CLI writes during `spi up` and refreshes on every
# `spi reconcile`. The substitution is deliberately not optional: without the
# ConfigMap this Kustomization fails loudly rather than labelling osdu with a
# guessed revision that would silently disable sidecar injection.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: osdu
  labels:
    app.kubernetes.io/managed-by: osdu-spi-stack
    istio.io/rev: ${ISTIO_REVISION}
