# Karpenter NodePools: platform for stateful middleware, osdu for the
# stateless OSDU services.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: platform
spec:
  template:
    metadata:
      labels:
        spi-pool: platform
    spec:
      taints:
        - key: workload
          value: "platform"
          effect: NoSchedule
      requirements:
        - key: karpenter.azure.com/sku-family
          operator: In
          values: ["D"]
        - key: karpenter.azure.com/sku-cpu
          operator: In
          values: ["8"]
        - key: karpenter.azure.com/sku-memory
          operator: Gt
          values: ["30000"]
        - key: karpenter.azure.com/sku-storage-premium-capable
          operator: In
          values: ["true"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Karpenter lists the non-zonal offering as zone "0"; a PV provisioned
        # there cannot attach to a zonal VM later.
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: ["0"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: platform
  disruption:
    # Relocating a stateful pod costs a permitted eviction, a same-zone
    # replacement, and a disk reattachment; not worth it on a few hosts.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
  limits:
    cpu: "64"
    memory: 256Gi
---
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: platform
spec:
  imageFamily: AzureLinux
  osDiskSizeGB: 128
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: osdu
spec:
  template:
    metadata:
      labels:
        spi-pool: osdu
    spec:
      taints:
        - key: workload
          value: "osdu"
          effect: NoSchedule
      requirements:
        - key: karpenter.azure.com/sku-family
          operator: In
          values: ["D"]
        - key: karpenter.azure.com/sku-cpu
          operator: In
          values: ["4", "8", "16"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Karpenter lists the non-zonal offering as zone "0"; a PV provisioned
        # there cannot attach to a zonal VM later.
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: ["0"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: osdu
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "64"
    memory: 256Gi
---
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: osdu
spec:
  imageFamily: AzureLinux
  osDiskSizeGB: 128
