apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: osdu-flux
spec:
  # Routes and ReferenceGrants target airflow-api-server, so the release
  # name must stay airflow rather than Flux's default platform-airflow.
  releaseName: airflow
  targetNamespace: platform
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airflow
      version: "1.22.*"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
  values:
    # Pinned so a chart bump cannot silently change the Airflow release.
    airflowVersion: "3.2.2"
    defaultAirflowTag: "3.2.2"

    executor: KubernetesExecutor

    postgresql:
      enabled: false
    # KubernetesExecutor needs no broker; this also stops the chart rendering
    # an unused redis-password secret.
    redis:
      enabled: false
    data:
      metadataSecretName: airflow-metadata-secret

    # Signing material comes from the CLI-generated secret. Left unset, the
    # chart mints new api-secret/JWT keys on every render, invalidating
    # sessions and task tokens on each Flux reconcile.
    apiSecretKeySecretName: airflow-api-credentials
    jwtSecretName: airflow-api-credentials
    fernetKeySecretName: airflow-api-credentials

    workers:
      persistence:
        enabled: false
    logs:
      persistence:
        enabled: false

    # useHelmHooks is per-job; without it Flux skips the hook-owned Job and
    # leaves the schema uninitialized.
    migrateDatabaseJob:
      enabled: true
      useHelmHooks: false
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # The admin identity lives only in these args; the chart's defaultUser
    # block is ignored once args are overridden. 'users create' skips an
    # existing user, so 'reset-password' makes the secret's password win.
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
      args:
        - "bash"
        - "-c"
        - |-
          airflow users create "$@" || true
          airflow users reset-password -u admin -p "$AIRFLOW_ADMIN_PW"
        - --
        - "-r"
        - "Admin"
        - "-u"
        - "admin"
        - "-e"
        - "admin@osdu.local"
        - "-f"
        - "OSDU"
        - "-l"
        - "Admin"
        - "-p"
        - "$(AIRFLOW_ADMIN_PW)"
      env:
        - name: AIRFLOW_ADMIN_PW
          valueFrom:
            secretKeyRef:
              name: airflow-api-credentials
              key: password
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    apiServer:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    scheduler:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    dagProcessor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # Kept so deferrable operators remain available.
    triggerer:
      persistence:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    statsd:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # git-sync is off: OSDU GitLab requires authentication.
    dags:
      gitSync:
        enabled: false

    config:
      api:
        # Only the path matters: it becomes the FastAPI root_path, so the UI
        # and API serve under /airflow behind the gateway without a rewrite.
        base_url: "http://localhost:8080/airflow"
