apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: osdu-flux
spec:
  # Pin release name so chart resources are named airflow-* (not
  # platform-airflow-*, which is the default Flux <targetNamespace>-<name>
  # concatenation). Routes and ReferenceGrants target airflow-api-server,
  # so the release name must match or Envoy returns 500.
  releaseName: airflow
  targetNamespace: platform
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airflow
      version: "1.22.*"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
  values:
    # Pin the Airflow version explicitly so a chart bump can never silently
    # change the Airflow release.
    airflowVersion: "3.2.2"
    defaultAirflowTag: "3.2.2"

    executor: KubernetesExecutor

    # Use external PostgreSQL (CNPG)
    postgresql:
      enabled: false
    # No Celery broker with KubernetesExecutor; also stops the chart
    # rendering an unused redis-password secret. (The inert broker-url
    # Secret still renders; its gate is data.brokerUrlSecretName.)
    redis:
      enabled: false
    data:
      metadataSecretName: airflow-metadata-secret

    # All Airflow signing material comes from the CLI-generated
    # airflow-api-credentials secret. Left unset, the chart mints random
    # api-secret/JWT keys on every Helm render (each Flux reconcile would
    # invalidate sessions and task tokens) and keeps the fernet key in an
    # untracked pre-install-hook Secret outside the release.
    apiSecretKeySecretName: airflow-api-credentials
    jwtSecretName: airflow-api-credentials
    fernetKeySecretName: airflow-api-credentials

    # Disable PVC persistence -- use emptyDir to avoid storage bloat
    workers:
      persistence:
        enabled: false
    logs:
      persistence:
        enabled: false

    # Database migration job. useHelmHooks false is per-job (there is no
    # global switch): without it Flux skips the hook-owned Job and leaves
    # the schema uninitialized.
    migrateDatabaseJob:
      enabled: true
      useHelmHooks: false
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # Create default admin user job (valid under the FAB auth manager, the
    # chart default for Airflow 3). The admin identity lives only in these
    # args; the chart's defaultUser block is not consulted once args are
    # overridden. 'airflow users create' skips existing users, so we follow
    # up with 'reset-password' to ensure the secret's password wins.
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
      args:
        - "bash"
        - "-c"
        - |-
          airflow users create "$@" || true
          airflow users reset-password -u admin -p "$AIRFLOW_ADMIN_PW"
        - --
        - "-r"
        - "Admin"
        - "-u"
        - "admin"
        - "-e"
        - "admin@osdu.local"
        - "-f"
        - "OSDU"
        - "-l"
        - "Admin"
        - "-p"
        - "$(AIRFLOW_ADMIN_PW)"
      env:
        - name: AIRFLOW_ADMIN_PW
          valueFrom:
            secretKeyRef:
              name: airflow-api-credentials
              key: password
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # API server (serves the UI, REST API, and task execution API)
    apiServer:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # Scheduler
    scheduler:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # DAG processor (standalone in Airflow 3; parses the DAG folder)
    dagProcessor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # Triggerer (kept enabled so deferrable operators remain available)
    triggerer:
      persistence:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # StatsD sidecar (AKS Deployment Safeguards compliance)
    statsd:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # DAGs via git-sync (disabled; OSDU GitLab requires authentication)
    dags:
      gitSync:
        enabled: false

    # Config
    config:
      api:
        # Only the path component matters: it becomes the FastAPI root_path
        # so the UI/API serve under /airflow behind the gateway without a
        # URL rewrite, and the chart derives execution_api_server_url from
        # the same path.
        base_url: "http://localhost:8080/airflow"
