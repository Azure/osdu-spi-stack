# Partial Service applied server-side: Flux owns only these annotations; the
# AKS Istio add-on owns the Service. Only the flux-system controllers are
# exempt from the admission policy that denies writes in aks-istio-ingress.
apiVersion: v1
kind: Service
metadata:
  name: aks-istio-ingressgateway-external
  namespace: aks-istio-ingress
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    service.beta.kubernetes.io/azure-dns-label-name: ${DNS_LABEL}
