# Partial Service applied server-side: Flux owns only the annotations
# listed here; the AKS Istio add-on owns the Service itself. The write
# must flow through Flux because the aks-managed-protect-system-namespaces
# admission policy denies aks-istio-ingress writes to every identity
# except the exempted flux-system controllers.
apiVersion: v1
kind: Service
metadata:
  name: aks-istio-ingressgateway-external
  namespace: aks-istio-ingress
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    service.beta.kubernetes.io/azure-dns-label-name: ${DNS_LABEL}
