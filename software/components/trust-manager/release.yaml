apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: osdu-flux
spec:
  targetNamespace: foundation
  interval: 30m
  chart:
    spec:
      chart: trust-manager
      version: "v0.22.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: osdu-flux
  # The defaultPackage init container ships without resource requests and
  # fails Deployment Safeguards; the Bundles source from Secrets, so it is
  # disabled.
  values:
    crds:
      enabled: true
    defaultPackage:
      enabled: false
    # Source CAs live in platform (Redis via cert-manager, Elasticsearch via
    # ECK).
    app:
      trust:
        namespace: platform
      # AKS Deployment Safeguards compliance
      securityContext:
        seccompProfileEnabled: true
      # The metrics Service shares the main Service's selector, which
      # Deployment Safeguards rejects; nothing scrapes it.
      metrics:
        service:
          enabled: false
    # Bundle targets may write Secrets, scoped to the two names the OSDU
    # services mount.
    secretTargets:
      enabled: true
      authorizedSecrets:
        - redis-ca-cert
        - elastic-ca-cert
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
